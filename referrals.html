
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рефералы и доступ — CryptoFaucet Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#1a1a1a;color:#fff;font-family:Arial,sans-serif}
.container{max-width:900px;margin:0 auto;padding:22px;background:#2a2a2a;border-radius:10px;box-shadow:0 4px 15px #0008}
h1,h2{color:#00ffcc;text-align:center}
.subtitle{text-align:center;color:#bbb;margin-top:-5px}
.panel{background:#222831;border:1px solid #41414c;border-radius:8px;padding:16px;margin:18px 0}
label{display:block;color:#ccc;margin:0 0 6px;font-size:14px}
input,select{width:100%;height:42px;padding:9px 10px;background:#171717;color:#fff;border:1px solid #555;border-radius:5px;font-size:15px}
input:focus,select:focus{outline:none;border-color:#00ffcc}
.form-row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
button{border:0;border-radius:5px;padding:10px 14px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{width:100%;margin-top:12px;background:#00ffcc;color:#111;font-size:15px}
.secondary{background:#3498db;color:#fff}
.danger{background:#d64545;color:#fff}
.success{background:#27ae60;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stat{padding:12px;background:#202630;border:1px solid #41414c;border-radius:7px;text-align:center}
.stat span{display:block;color:#bbb;font-size:13px}
.stat strong{display:block;font-size:25px;margin-top:4px}
#total{color:#00d9ff}
#referrals{color:#2ecc71}
#buyers{color:#ffbb55}
#admins{color:#c084fc}
.user{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #444}
.user:last-child{border-bottom:0}
.user-info{min-width:0;overflow-wrap:anywhere}
.username{font-weight:bold;font-size:16px}
.meta{color:#aaa;font-size:13px;margin-top:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.actions button{font-size:12px;padding:8px 10px}
.status-active{color:#2ecc71}
.status-disabled{color:#ff7777}
.admin-label{color:#c084fc;font-weight:bold}
.protected-label{color:#c084fc;font-size:12px}
#message{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 0;font-size:14px}
.nav{display:inline-block;margin-top:18px;color:#00ffcc;text-decoration:none}
.empty{text-align:center;color:#aaa;padding:24px 8px}
.hidden{display:none!important}
@media(max-width:600px){
 body{padding:10px}
 .container{padding:13px}
 .form-row{grid-template-columns:1fr}
 .user{align-items:flex-start;flex-direction:column}
 .actions{justify-content:flex-start}
 .stats{grid-template-columns:repeat(2,1fr);gap:5px}
 .stat{padding:9px 4px}
 .stat strong{font-size:21px}
}
</style>
</head>
<body>
<div class="container">
<h1>👥 Рефералы / Доступ</h1>
<p class="subtitle">Управление пользователями CryptoFaucet Hub</p>

<div id="loading" class="panel">Подключение к GitHub...</div>

<div id="main" class="hidden">
  <div class="stats">
    <div class="stat"><span>Всего записей</span><strong id="total">0</strong></div>
    <div class="stat"><span>Рефералы</span><strong id="referrals">0</strong></div>
    <div class="stat"><span>Покупатели</span><strong id="buyers">0</strong></div>
    <div class="stat"><span>Администраторы</span><strong id="admins">0</strong></div>
  </div>

  <div class="panel">
    <h2>➕ Добавить пользователя</h2>
    <div class="form-row">
      <div>
        <label for="username">FaucetPay Username</label>
        <input id="username" type="text" maxlength="80" placeholder="Введите FaucetPay-ник" autocomplete="off">
      </div>
      <div>
        <label for="userType">Тип доступа</label>
        <select id="userType">
          <option value="referral">Реферал</option>
          <option value="buyer">Покупатель</option>
          <option value="admin">Администратор</option>
        </select>
      </div>
    </div>
    <button id="addButton" class="primary" type="button">Добавить в список доступа</button>
  </div>

  <div class="panel">
    <h2>Список пользователей</h2>
    <div id="usersList"></div>
  </div>

  <p id="message" role="status" aria-live="polite"></p>
</div>

<a href="admin.html" class="nav">← Вернуться в админку</a>
</div>

<script>
'use strict';

const OWNER = 'cryptofaucet';
const REPO = 'faucets';
const BRANCH = 'main';
const FILE_PATH = 'access.json';
const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;

// Главный администратор CryptoFaucet Hub
const MAIN_ADMIN = 'tepmuhatop';

let token = '';
let fileSha = '';
let accessData = { users: [], last_updated: null };
let busy = false;

function headers() {
  return {
    Authorization: `Bearer ${token}`,
    Accept: 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

function decodeBase64UTF8(value) {
  const binary = atob(value.replace(/\s/g, ''));
  const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function encodeBase64UTF8(value) {
  const bytes = new TextEncoder().encode(value);
  let binary = '';

  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }

  return btoa(binary);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}

function setMessage(text, isError = false) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.style.color = isError ? '#ff7777' : '#2ecc71';
}

async function loadAccessFile() {
  const response = await fetch(`${API_URL}?ref=${BRANCH}`, {
    headers: headers(),
    cache: 'no-store'
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(`GitHub: ${response.status} — ${data.message || 'Не удалось прочитать access.json'}`);
  }

  if (!data.content || !data.sha) {
    throw new Error('GitHub не вернул содержимое access.json или SHA.');
  }

  const parsed = JSON.parse(decodeBase64UTF8(data.content));

  if (!parsed || !Array.isArray(parsed.users)) {
    throw new Error('В access.json должен быть массив users.');
  }

  fileSha = data.sha;

  accessData = {
    users: parsed.users
      .filter(u => u && typeof u.username === 'string')
      .map(u => ({
        username: u.username.trim(),
        type: ['buyer', 'admin'].includes(u.type) ? u.type : 'referral',
        active: u.active !== false
      })),
    last_updated: parsed.last_updated || null
  };

  render();
}

async function saveAccessFile(commitMessage) {
  if (busy) {
    throw new Error('Дождитесь завершения предыдущего сохранения.');
  }

  busy = true;
  document.getElementById('addButton').disabled = true;

  try {
    accessData.last_updated = new Date().toISOString();

    const body = {
      message: commitMessage,
      content: encodeBase64UTF8(JSON.stringify(accessData, null, 2) + '\n'),
      branch: BRANCH,
      sha: fileSha
    };

    const response = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        ...headers(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(`GitHub: ${response.status} — ${result.message || 'Не удалось сохранить access.json'}`);
    }

    fileSha = result.content?.sha || fileSha;
    render();
    setMessage('Изменения сохранены на GitHub.');
  } finally {
    busy = false;
    document.getElementById('addButton').disabled = false;
  }
}

// Автоматически добавляем главного администратора или восстанавливаем его права.
async function ensureMainAdmin() {
  const previousUsers = JSON.parse(JSON.stringify(accessData.users));

  const admin = accessData.users.find(
    u => u.username.toLowerCase() === MAIN_ADMIN.toLowerCase()
  );

  let changed = false;

  if (!admin) {
    accessData.users.push({
      username: MAIN_ADMIN,
      type: 'admin',
      active: true
    });
    changed = true;
  } else {
    if (admin.username !== MAIN_ADMIN) {
      admin.username = MAIN_ADMIN;
      changed = true;
    }

    if (admin.type !== 'admin') {
      admin.type = 'admin';
      changed = true;
    }

    if (!admin.active) {
      admin.active = true;
      changed = true;
    }
  }

  if (!changed) return;

  render();

  try {
    await saveAccessFile(`Назначен главный администратор: ${MAIN_ADMIN}`);
    setMessage(`Главный администратор ${MAIN_ADMIN} добавлен/проверен. Данные сохранены на GitHub.`);
  } catch (error) {
    accessData.users = previousUsers;
    render();
    setMessage(
      `Не удалось сохранить администратора на GitHub: ${error.message}`,
      true
    );
  }
}

function isAdmin(user) {
  return user.type === 'admin';
}

function render() {
  const users = accessData.users;

  document.getElementById('total').textContent = users.length;
  document.getElementById('referrals').textContent =
    users.filter(u => u.type === 'referral').length;
  document.getElementById('buyers').textContent =
    users.filter(u => u.type === 'buyer').length;
  document.getElementById('admins').textContent =
    users.filter(u => u.type === 'admin').length;

  const list = document.getElementById('usersList');

  if (!users.length) {
    list.innerHTML = '<div class="empty">Список пока пуст. Добавьте первого пользователя выше.</div>';
    return;
  }

  list.innerHTML = users.map((user, index) => {
    const admin = isAdmin(user);

    const typeName = admin
      ? 'Администратор'
      : user.type === 'buyer'
        ? 'Покупатель'
        : 'Реферал';

    return `
      <div class="user">
        <div class="user-info">
          <div class="username">${escapeHTML(user.username)}</div>
          <div class="meta">
            <span class="${admin ? 'admin-label' : ''}">${typeName}</span> ·
            <span class="${user.active ? 'status-active' : 'status-disabled'}">
              ${user.active ? 'Доступ активен' : 'Доступ отключён'}
            </span>
            ${admin ? '<div class="protected-label">🔒 Защищённая учётная запись</div>' : ''}
          </div>
        </div>

        <div class="actions">
          ${
            admin
              ? '<span class="protected-label">Управление заблокировано</span>'
              : `
                <button class="${user.active ? 'danger' : 'success'}"
                  type="button" onclick="toggleUser(${index})">
                  ${user.active ? 'Отключить' : 'Включить'}
                </button>
                <button class="secondary"
                  type="button" onclick="changeType(${index})">
                  Изменить тип
                </button>
                <button class="danger"
                  type="button" onclick="deleteUser(${index})">
                  Удалить
                </button>
              `
          }
        </div>
      </div>
    `;
  }).join('');
}

async function addUser() {
  if (busy) return;

  const input = document.getElementById('username');
  const username = input.value.trim();
  const type = document.getElementById('userType').value;

  if (!username) {
    return setMessage('Введите FaucetPay-ник.', true);
  }

  if (!['referral', 'buyer', 'admin'].includes(type)) {
    return setMessage('Неизвестный тип доступа.', true);
  }

  if (accessData.users.some(
    u => u.username.toLowerCase() === username.toLowerCase()
  )) {
    return setMessage('Такой ник уже есть в списке.', true);
  }

  const newUser = {
    username,
    type,
    active: true
  };

  accessData.users.push(newUser);
  render();

  try {
    await saveAccessFile(`Добавлен пользователь доступа: ${username}`);
    input.value = '';
  } catch (error) {
    accessData.users = accessData.users.filter(u => u !== newUser);
    render();
    setMessage(error.message, true);
  }
}

async function toggleUser(index) {
  if (busy) return;

  const user = accessData.users[index];

  if (!user || isAdmin(user)) return;

  const oldValue = user.active;
  user.active = !user.active;
  render();

  try {
    await saveAccessFile(
      `${user.active ? 'Включён' : 'Отключён'} доступ: ${user.username}`
    );
  } catch (error) {
    user.active = oldValue;
    render();
    setMessage(error.message, true);
  }
}

async function changeType(index) {
  if (busy) return;

  const user = accessData.users[index];

  if (!user || isAdmin(user)) return;

  const oldValue = user.type;
  user.type = user.type === 'referral' ? 'buyer' : 'referral';
  render();

  try {
    await saveAccessFile(`Изменён тип доступа: ${user.username}`);
  } catch (error) {
    user.type = oldValue;
    render();
    setMessage(error.message, true);
  }
}

async function deleteUser(index) {
  if (busy) return;

  const user = accessData.users[index];

  if (!user || isAdmin(user)) return;

  if (!confirm(`Удалить ${user.username} из списка доступа?`)) return;

  const removed = accessData.users.splice(index, 1)[0];
  render();

  try {
    await saveAccessFile(`Удалён пользователь доступа: ${removed.username}`);
  } catch (error) {
    accessData.users.splice(index, 0, removed);
    render();
    setMessage(error.message, true);
  }
}

document.getElementById('addButton').addEventListener('click', addUser);

document.getElementById('username').addEventListener('keydown', event => {
  if (event.key === 'Enter') addUser();
});

(async function init() {
  token = sessionStorage.getItem('git_admin_token') || '';

  if (!token) {
    document.getElementById('loading').textContent =
      'Не найден GitHub Token. Вернитесь в админку, войдите и откройте эту страницу кнопкой «Рефералы / Доступ».';
    return;
  }

  try {
    await loadAccessFile();

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');

    await ensureMainAdmin();

  } catch (error) {
    document.getElementById('loading').textContent =
      `Ошибка загрузки: ${error.message}`;
  }
})();
</script>
</body>
</html>
