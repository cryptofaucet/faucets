<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель управления кранами</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#1a1a1a;color:#fff;padding:20px}
.container{width:100%;max-width:1100px;margin:0 auto;background:#2a2a2a;padding:20px;border-radius:8px;box-shadow:0 4px 10px #0008}
h1,h2{text-align:center;color:#00ffcc}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:5px;color:#ccc}
input[type=password]{width:100%;padding:10px;border-radius:4px;border:1px solid #444;background:#333;color:#fff}
button{width:100%;padding:10px;background:#00ffcc;border:0;color:#1a1a1a;font-weight:bold;border-radius:4px;cursor:pointer;font-size:16px}
button:hover{background:#00ccaa}
button:disabled{opacity:.6;cursor:wait}
.hidden{display:none!important}
.faucet-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 22px}
.faucet-stat{background:#202630;border:1px solid #41414c;border-radius:8px;padding:12px 8px;text-align:center}
.faucet-stat-label{color:#b8c2cf;font-size:13px}
.faucet-stat-value{display:block;font-size:26px;font-weight:800;margin-top:4px}
#statsTotal{color:#00d9ff}#statsWorking{color:#2ecc71}#statsDisabled{color:#ff7777}
.faucet-stats-updated{grid-column:1/-1;text-align:center;color:#aab4c2;font-size:12px;overflow-wrap:anywhere}
.add-faucet-panel{background:#222831;border:1px solid #41414c;border-radius:8px;padding:18px;margin:18px 0 24px}
.add-faucet-panel h2{margin:0 0 16px;color:#ff9900;font-size:20px}
.add-faucet-row{display:grid;gap:12px;margin-bottom:12px}
.add-faucet-row-one{grid-template-columns:minmax(0,2fr) 82px minmax(0,2fr)}
.add-faucet-row-two{grid-template-columns:repeat(3,minmax(0,1fr))}
.add-faucet-panel .field{min-width:0}
.add-faucet-panel label{font-size:13px;font-weight:bold}
.add-faucet-panel input{width:100%;min-width:0;height:38px;padding:8px 9px;border:1px solid #444;border-radius:4px;background:#1a1a1a;color:#fff}
.add-faucet-panel input:focus{outline:none;border-color:#ff9900}
.add-faucet-panel input::-webkit-outer-spin-button,.add-faucet-panel input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add-faucet-panel input[type=number]{-moz-appearance:textfield}
#addFaucetButton{background:#ff9900;color:#1a1a1a;margin-top:2px}
#addFaucetButton:hover{background:#e08800}
#addFaucetMessage{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.faucet-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #444}
.faucet-name{font-weight:bold;overflow-wrap:anywhere;display:flex;align-items:center;gap:9px;min-width:0}
.faucet-id{color:#ff9d2e;font-weight:800;min-width:2.2em;flex-shrink:0}
.faucet-label{overflow-wrap:anywhere}
.vip-toggle{width:auto;flex-shrink:0;padding:5px 8px;border:1px solid #666;border-radius:5px;background:#383838;color:#aaa;font-size:12px;line-height:1.2}

<script>
'use strict';

const GITHUB_USER = "cryptofaucet";
const GITHUB_REPO = "faucets";
const FILE_PATH = "status.json";
const INDEX_FILE_PATH = "index.html";
const DRIPS_FILE_PATH = "drips.json";
const DRIPS_INDEX_FILE_PATH = "drips.html";
const BRANCH = "main";

const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
const INDEX_API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${INDEX_FILE_PATH}`;
const DRIPS_API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DRIPS_FILE_PATH}`;
const DRIPS_INDEX_API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DRIPS_INDEX_FILE_PATH}`;

let FAUCETS = [];
let globalDisabledFaucets = [];
let dripsDisabledFaucets = [];
let vipFaucets = new Set();
let fileSha = "";
let statsLastUpdated = null;

function githubHeaders(token) {
    return {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
    };
}

async function githubGetFile(path) {
    const token = localStorage.getItem("git_admin_token");
    if (!token) throw new Error("Токен GitHub не найден. Войдите заново.");
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?ref=${encodeURIComponent(BRANCH)}`;
    const response = await fetch(url, { headers: githubHeaders(token), cache: "no-store" });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.content || !data.sha) {
        throw new Error(`GitHub ${response.status}: ${data.message || "Не удалось прочитать " + path}`);
    }
    return { data, content: decodeBase64UTF8(data.content), sha: data.sha };
}

async function githubPutFile(path, content, sha, message) {
    const token = localStorage.getItem("git_admin_token");
    if (!token) throw new Error("Токен GitHub не найден. Войдите заново.");
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
    const response = await fetch(url, {
        method: "PUT",
        headers: { ...githubHeaders(token), "Content-Type": "application/json" },
        body: JSON.stringify({ message, content: encodeBase64UTF8(content), sha, branch: BRANCH })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(`GitHub ${response.status}: ${result.message || "Не удалось сохранить " + path}`);
    return result;
}

async function updateJsonFile(path, updater, message) {
    const file = await githubGetFile(path);
    let json;
    try { json = JSON.parse(file.content); }
    catch (_) { throw new Error(`${path}: некорректный JSON. Файл не изменён.`); }
    const updated = updater(json || {});
    await githubPutFile(path, JSON.stringify(updated, null, 2), file.sha, message);
    return updated;
}

async function loadDripsSettings() {
    const file = await githubGetFile(DRIPS_FILE_PATH);
    let content;
    try { content = JSON.parse(file.content); }
    catch (_) { throw new Error("drips.json содержит некорректный JSON."); }
    if (!content || typeof content !== "object" || Array.isArray(content)) {
        throw new Error("Неверный формат drips.json.");
    }
    dripsDisabledFaucets = Array.isArray(content.drips_disabled_faucets)
        ? [...new Set(content.drips_disabled_faucets.map(String))] : [];
}

function isDripsDisabled(id) {
    return dripsDisabledFaucets.includes(String(id));
}

function isVipFaucet(id) {
    return vipFaucets.has(String(id));
}

function decodeBase64UTF8(value) {
    const binary = atob(value.replace(/\s/g, ""));
    const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
}

function encodeBase64UTF8(value) {
    const bytes = new TextEncoder().encode(value);
    let binary = "";
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[character]);
}

function escapeAttribute(value) {
    return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* Формат отключённого крана: "Название (faucet23)" */
function getDisabledFaucetEntry(name, id) {
    return `${name} (faucet${id})`;
}

function getDisabledFaucetId(entry) {
    const value = String(entry).trim();
    const match = value.match(/(?:\(|^)faucet(\d+)\)?$/i);
    return match ? match[1] : null;
}

function getDisabledFaucetName(entry) {
    const value = String(entry).trim();
    if (/^faucet\d+$/i.test(value)) return "";
    return value.replace(/\s*\(faucet\d+\)\s*$/i, "").trim();
}

/*
 * Старые записи только с названием и записи вида "faucet23"
 * преобразуются в "Название (faucet23)", когда ID найден в index.html.
 */
function normalizeDisabledFaucets() {
    const result = [];
    const seenIds = new Set();
    const seenLegacyNames = new Set();

    for (const rawEntry of globalDisabledFaucets) {
        const entry = String(rawEntry).trim();
        if (!entry) continue;

        const id = getDisabledFaucetId(entry);

        if (id) {
            const faucet = FAUCETS.find(item => String(item.id) === id);
            if (seenIds.has(id)) continue;
            seenIds.add(id);
            result.push(faucet ? getDisabledFaucetEntry(faucet.name, id) : entry);
            continue;
        }

        const oldName = getDisabledFaucetName(entry);
        const faucet = FAUCETS.find(item => item.name === oldName);

        if (faucet) {
            const faucetId = String(faucet.id);
            if (seenIds.has(faucetId)) continue;
            seenIds.add(faucetId);
            result.push(getDisabledFaucetEntry(faucet.name, faucetId));
        } else if (!seenLegacyNames.has(oldName)) {
            seenLegacyNames.add(oldName);
            result.push(entry);
        }
    }

    globalDisabledFaucets = result;
}

function isFaucetDisabled(faucet) {
    const id = String(faucet.id);
    return globalDisabledFaucets.some(entry => {
        const entryId = getDisabledFaucetId(entry);
        if (entryId) return entryId === id;
        return getDisabledFaucetName(entry) === faucet.name;
    });
}

window.addEventListener("load", function () {
    const savedToken = localStorage.getItem("git_admin_token");
    if (savedToken) {
        document.getElementById("tokenInput").value = savedToken;
        login();
    }
});

async function login() {
    const token = document.getElementById("tokenInput").value.trim();
    if (!token) {
        alert("Введите GitHub Token!");
        return;
    }

    const loginButton = document.getElementById("loginButton");
    loginButton.disabled = true;
    loginButton.textContent = "Подключение...";

    try {
        const response = await fetch(GITHUB_API_URL, {
            headers: githubHeaders(token),
            cache: "no-store"
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(`GitHub: ${response.status} — ${data.message || "Не удалось прочитать status.json"}`);
        }
        if (!data.content || !data.sha) {
            throw new Error("GitHub не вернул содержимое файла или SHA.");
        }

        const content = JSON.parse(decodeBase64UTF8(data.content));
        if (!content || !Array.isArray(content.disabled_faucets)) {
            throw new Error("Неверный формат status.json: отсутствует массив disabled_faucets.");
        }

        fileSha = data.sha;
        globalDisabledFaucets = [...new Set(content.disabled_faucets.map(String))];

        const settings = content.faucet_settings &&
            typeof content.faucet_settings === "object" &&
            !Array.isArray(content.faucet_settings)
                ? content.faucet_settings : {};

        vipFaucets = new Set(
            Object.entries(settings)
                .filter(([, value]) => value && typeof value === "object" && value.vip === true)
                .map(([id]) => String(id))
        );

        statsLastUpdated = content.last_updated || null;
         localStorage.setItem("git_admin_token", token);
        await loadDripsSettings();

        document.getElementById("loginBlock").classList.add("hidden");
        document.getElementById("adminBlock").classList.remove("hidden");

        await fetchAndParseFaucets();
    } catch (error) {
        console.error("Ошибка входа:", error);
        alert("Не удалось войти в админку.\n\n" + error.message +
            "\n\nПроверьте адрес API, доступ к репозиторию и права токена.");
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Войти";
    }
}

function formatStatsDate(value) {
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    return new Intl.DateTimeFormat("ru-RU", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit"
    }).format(date);
}

function updateFaucetStats() {
    const total = FAUCETS.length;
    const disabled = FAUCETS.filter(isFaucetDisabled).length;
    const working = total - disabled;

    const totalEl = document.getElementById("statsTotal");
    const workingEl = document.getElementById("statsWorking");
    const disabledEl = document.getElementById("statsDisabled");
    const updatedEl = document.getElementById("statsUpdated");

    if (totalEl) totalEl.textContent = String(total);
    if (workingEl) workingEl.textContent = String(working);
    if (disabledEl) disabledEl.textContent = String(disabled);
    if (updatedEl) updatedEl.textContent = "Последнее изменение: " + formatStatsDate(statsLastUpdated);
}

function markStatsUpdated(value = new Date().toISOString()) {
    statsLastUpdated = value;
    updateFaucetStats();
}

async function fetchAndParseFaucets() {
    const listDiv = document.getElementById("faucetsList");
    listDiv.innerHTML = '<p class="message" style="color:#ffcc00">Загружаю список кранов с GitHub...</p>';

    try {
        const token = localStorage.getItem("git_admin_token");
        if (!token) throw new Error("Токен GitHub не найден. Войдите заново.");

        const response = await fetch(`${INDEX_API_URL}?ref=${encodeURIComponent(BRANCH)}`, {
            headers: githubHeaders(token),
            cache: "no-store"
        });
        const fileData = await response.json().catch(() => ({}));

        if (!response.ok) throw new Error(`GitHub ${response.status}: ${fileData.message || "Не удалось загрузить index.html"}`);
        if (!fileData.content) throw new Error("GitHub не вернул содержимое index.html.");

        const doc = new DOMParser().parseFromString(decodeBase64UTF8(fileData.content), "text/html");
        FAUCETS = Array.from(doc.querySelectorAll('tr[id^="faucet"]'))
            .map(row => {
                const match = row.id.match(/^faucet(\d+)$/);
                const link = row.querySelector("a.faucet-link");
                if (!match || !link) return null;

                const timerMatch = (link.getAttribute("onclick") || "")
                    .match(/startTimer\s*\(\s*['"]faucet\d+['"]\s*,\s*(\d+(?:\.\d+)?)\s*\)/);

                const minutes = timerMatch ? Number(timerMatch[1]) / 60 : null;

                const name = link.textContent.trim();
                if (!name) return null;

                const rewardInput = row.querySelector("input.crypto-input");
                const badge = row.querySelector(".crypto-badge");

                return {
                    id: match[1],
                    name,
                    url: link.getAttribute("href") || "",
                    reward: rewardInput?.getAttribute("value") ?? rewardInput?.value ?? "",
                    coin: badge?.textContent.trim().toUpperCase() || "",
                    minutes
                };
            })
            .filter(Boolean);

        normalizeDisabledFaucets();
        updateFaucetStats();

        if (!FAUCETS.length) {
            listDiv.innerHTML = '<p class="message" style="color:#ff6666">Краны не найдены. Проверьте разметку index.html.</p>';
            return;
        }

        renderAdminList();
    } catch (error) {
        console.error("Ошибка загрузки списка:", error);
        listDiv.innerHTML = '<p class="message" style="color:#ff6666">Не удалось загрузить список кранов: ' +
            escapeHTML(error.message) + '</p>';
    }
}

async function toggleVipFaucet(id, button) {
    const idString = String(id);
    const wasVip = isVipFaucet(idString);
    const nextVip = !wasVip;

    button.disabled = true;
    button.textContent = "…";

    try {
        const timestamp = new Date().toISOString();

        const updated = await updateJsonFile(FILE_PATH, content => {
            if (!content || typeof content !== "object" || Array.isArray(content)) {
                throw new Error("Неверный формат status.json.");
            }

            content.faucet_settings =
                content.faucet_settings &&
                typeof content.faucet_settings === "object" &&
                !Array.isArray(content.faucet_settings)
                    ? content.faucet_settings : {};

            const previousSettings = content.faucet_settings[idString] &&
                typeof content.faucet_settings[idString] === "object"
                    ? content.faucet_settings[idString] : {};

            content.faucet_settings[idString] = {
                ...previousSettings,
                vip: nextVip
            };

            content.last_updated = timestamp;
            return content;
        }, `${nextVip ? "Enable" : "Disable"} VIP for faucet ${idString}`);

        const savedSettings = updated.faucet_settings &&
            updated.faucet_settings[idString];

        if (savedSettings && savedSettings.vip === true) {
            vipFaucets.add(idString);
        } else {
            vipFaucets.delete(idString);
        }

        markStatsUpdated(timestamp);
        renderAdminList();
    } catch (error) {
        console.error("Ошибка изменения VIP:", error);
        alert("Не удалось сохранить VIP в status.json.\nСостояние не изменено.\n\n" + error.message);
        renderAdminList();
    }
}

function toggleFaucet(name, id) {
    const idString = String(id);
    const faucet = FAUCETS.find(item => String(item.id) === idString);
    const isDisabled = faucet ? isFaucetDisabled(faucet) :
        globalDisabledFaucets.some(entry => getDisabledFaucetId(entry) === idString);

    if (isDisabled) {
        globalDisabledFaucets = globalDisabledFaucets.filter(entry => {
            const entryId = getDisabledFaucetId(entry);
            if (entryId) return entryId !== idString;
            return getDisabledFaucetName(entry) !== name;
        });
    } else {
        globalDisabledFaucets.push(getDisabledFaucetEntry(name, idString));
    }

    normalizeDisabledFaucets();
    renderAdminList();
    updateFaucetStats();
}

async function toggleDripsFaucet(id, button) {
    const idString = String(id);
    const wasDisabled = isDripsDisabled(idString);
    const next = wasDisabled
        ? dripsDisabledFaucets.filter(value => value !== idString)
        : [...dripsDisabledFaucets, idString];

    button.disabled = true;
    button.textContent = "…";

    try {
        const timestamp = new Date().toISOString();
        const updated = await updateJsonFile(DRIPS_FILE_PATH, content => ({
            ...content,
            drips_disabled_faucets: next,
            last_updated: timestamp
        }), `${wasDisabled ? "Enable" : "Disable"} faucet ${idString} for Drips`);

        dripsDisabledFaucets = Array.isArray(updated.drips_disabled_faucets)
            ? [...new Set(updated.drips_disabled_faucets.map(String))] : [];

        renderAdminList();
        alert(isDripsDisabled(idString)
            ? `Кран ID ${idString} отключён только для Drips.`
            : `Кран ID ${idString} снова разрешён для Drips.`);
    } catch (error) {
        console.error("Ошибка изменения Drips:", error);
        alert("Не удалось обновить drips.json. Состояние не изменено.\n\n" + error.message);
        renderAdminList();
    }
}

async function saveChanges() {
    const token = localStorage.getItem("git_admin_token");
    if (!token) { alert("Сессия истекла. Войдите заново."); return; }

    const saveButton = document.getElementById("saveButton");
    saveButton.disabled = true;
    saveButton.textContent = "Сохранение в оба JSON...";

    try {
        normalizeDisabledFaucets();

        const updatedStatus = await updateJsonFile(FILE_PATH, content => ({
            ...content,
            disabled_faucets: globalDisabledFaucets,
            last_updated: timestamp
        }), "Update global faucet statuses");

        await updateJsonFile(DRIPS_FILE_PATH, content => ({
            ...content,

                ? content.drips_disabled_faucets.map(String) : dripsDisabledFaucets,

        }), "Sync global faucet statuses for Drips");

        globalDisabledFaucets = Array.isArray(updatedStatus.disabled_faucets)
            ? updatedStatus.disabled_faucets.map(String) : globalDisabledFaucets;

        markStatsUpdated(timestamp);
        alert("Общие статусы сохранены в status.json и drips.json.\nОтдельные настройки Drips сохранены без изменений.");
    } catch (error) {

async function updateFaucetInHtmlFile(path, oldId, newId, name, url, reward, coin, minutes) {
    const file = await githubGetFile(path);
    let source = file.content;
    const oldKey = "faucet" + oldId, newKey = "faucet" + newId;
    if (String(oldId) !== String(newId) && new RegExp("\\bid=[\"']" + newKey + "[\"']", "i").test(source))
        throw new Error("ID " + newKey + " уже занят в " + path + ".");
    const rowPattern = new RegExp("<tr\\b(?=[^>]*\\bid=[\"']" + oldKey + "[\"'])[^>]*>[\\s\\S]*?<\\/tr>", "i");
    const match = source.match(rowPattern);
    if (!match) throw new Error("Строка " + oldKey + " не найдена в " + path + ".");
    const rowHTML = match[0].split(oldKey).join(newKey);
    const doc = new DOMParser().parseFromString(rowHTML, "text/html");
    const row = doc.querySelector("tr");
    const link = row?.querySelector("a.faucet-link");
    const rewardInput = row?.querySelector("input.crypto-input");
    const badge = row?.querySelector(".crypto-badge");
    if (!row || !link || !rewardInput || !badge) throw new Error("У крана " + oldId + " отсутствуют нужные поля в " + path + ".");
    link.textContent = name;
    link.setAttribute("href", url);
    link.setAttribute("onclick", "startTimer('" + newKey + "', " + Math.round(minutes * 60) + ")");
    rewardInput.setAttribute("value", reward);
    badge.textContent = coin;
    badge.className = "badge " + coin.toLowerCase() + " crypto-badge";
    row.setAttribute("data-crypto", coin);
    source = source.replace(rowPattern, row.outerHTML);
    const commentPattern = new RegExp("<!--\\s*Faucet\\s+" + oldId + "\\s*:[\\s\\S]*?-->\\s*(?=<tr\\b(?=[^>]*\\bid=[\"']" + newKey + "[\"']))", "i");
    const safeName = name.replace(/--/g, "—").replace(/[<>]/g, "");
    source = source.replace(commentPattern, "<!-- Faucet " + newId + ": " + safeName + " -->\n");
    await githubPutFile(path, source, file.sha, "Edit faucet " + oldId + " -> " + newId + ": " + name);
}
async function updateFaucetSettingsJson(path, oldId, newId, oldName, name, url, reward, coin, minutes, timestamp) {
    return updateJsonFile(path, content => {
        content.disabled_faucets = Array.isArray(content.disabled_faucets) ? content.disabled_faucets : [];
        content.faucet_settings = content.faucet_settings && typeof content.faucet_settings === "object" && !Array.isArray(content.faucet_settings) ? content.faucet_settings : {};
        const oldKey = String(oldId), newKey = String(newId);
        if (oldKey !== newKey && Object.prototype.hasOwnProperty.call(content.faucet_settings, newKey))
            throw new Error("Настройки ID " + newKey + " уже существуют в " + path + ".");
        content.disabled_faucets = content.disabled_faucets.map(entry => {
            const entryId = getDisabledFaucetId(entry);
            if (entryId === oldKey || (!entryId && oldName && getDisabledFaucetName(entry) === oldName))
                return getDisabledFaucetEntry(name, newKey);
            return entry;
        });
        if (oldKey !== newKey) {
            if (content.faucet_settings[oldKey]) { content.faucet_settings[newKey] = content.faucet_settings[oldKey]; delete content.faucet_settings[oldKey]; }
            if (Array.isArray(content.drips_disabled_faucets))
                content.drips_disabled_faucets = content.drips_disabled_faucets.map(v => String(v) === oldKey ? newKey : String(v));
        }
        content.faucet_settings[newKey] = { ...(content.faucet_settings[newKey] || {}), name, url, reward, coin, minutes, _updated_at: timestamp };
        content.last_updated = timestamp;
        return content;
    }, "Update faucet settings " + oldId + " -> " + newId + ": " + name);
}

async function saveEditedFaucet(event) {
    event.preventDefault();
    const oldId = editingFaucetId, token = localStorage.getItem("git_admin_token");
    if (!oldId || !token) { showEditMessage("Нет выбранного крана или истекла сессия. Войди заново.", true); return; }
    const newId = document.getElementById("editFaucetId").value.trim();
    const name = document.getElementById("editFaucetName").value.trim();
    const urlText = document.getElementById("editFaucetUrl").value.trim();
    const reward = document.getElementById("editFaucetReward").value.trim();
    const coin = document.getElementById("editFaucetCoin").value.trim().toUpperCase();
    const minutes = Number(document.getElementById("editFaucetTime").value);
    if (!/^\d+$/.test(newId) || !Number.isSafeInteger(Number(newId)) || Number(newId) < 1) { showEditMessage("ID должен быть целым положительным числом.", true); return; }
    if (!name || !urlText || !reward || !coin || !Number.isFinite(minutes) || minutes < 0) { showEditMessage("Заполни все поля корректно. Таймер должен быть неотрицательным.", true); return; }
    if (!/^[A-Z0-9._-]+$/.test(coin)) { showEditMessage("Неверный формат валюты.", true); return; }
    let parsedURL;
    try { parsedURL = new URL(urlText); } catch (_) { showEditMessage("Укажи корректную ссылку.", true); return; }
    if (!["https:","http:"].includes(parsedURL.protocol)) { showEditMessage("Ссылка должна начинаться с http:// или https://.", true); return; }
    const btn = document.getElementById("editSaveButton");
    btn.disabled = true; btn.textContent = "Сохраняю обе версии..."; showEditMessage("");
    try {
        const oldFaucet = FAUCETS.find(x => String(x.id) === String(oldId));
        const oldName = oldFaucet?.name || "";
        const main = await githubGetFile(INDEX_FILE_PATH);
        const doc = new DOMParser().parseFromString(main.content, "text/html");
        if (Array.from(doc.querySelectorAll('tr[id^="faucet"]')).some(r => r.id === "faucet" + newId && r.id !== "faucet" + oldId))
            throw new Error("ID faucet" + newId + " уже занят.");
        if (Array.from(doc.querySelectorAll('tr[id^="faucet"] a.faucet-link')).some(a => a.closest("tr")?.id !== "faucet" + oldId && a.textContent.trim().toLowerCase() === name.toLowerCase()))
            throw new Error("Название «" + name + "» уже используется.");
        await updateFaucetInHtmlFile(INDEX_FILE_PATH, oldId, newId, name, parsedURL.href, reward, coin, minutes);
        await updateFaucetInHtmlFile(DRIPS_INDEX_FILE_PATH, oldId, newId, name, parsedURL.href, reward, coin, minutes);
        const stamp = new Date().toISOString();
        await updateFaucetSettingsJson(FILE_PATH, oldId, newId, oldName, name, parsedURL.href, reward, coin, minutes, stamp);
        await updateFaucetSettingsJson(DRIPS_FILE_PATH, oldId, newId, oldName, name, parsedURL.href, reward, coin, minutes, stamp);
        if (oldFaucet) Object.assign(oldFaucet, { id:String(newId), name, url:parsedURL.href, reward, coin, minutes });
        dripsDisabledFaucets = dripsDisabledFaucets.map(value => String(value) === String(oldId) ? String(newId) : String(value));
        if (vipFaucets.has(String(oldId))) { vipFaucets.delete(String(oldId)); vipFaucets.add(String(newId)); }
        const status = JSON.parse((await githubGetFile(FILE_PATH)).content);
        globalDisabledFaucets = Array.isArray(status.disabled_faucets) ? status.disabled_faucets.map(String) : [];
        const settings = status.faucet_settings || {};
        vipFaucets = new Set(Object.entries(settings).filter(([,v]) => v && v.vip === true).map(([k]) => String(k)));
        normalizeDisabledFaucets(); markStatsUpdated(stamp); renderAdminList(); updateFaucetStats();
        showEditMessage("Готово! ID " + oldId + " изменён на " + newId + " во всех четырёх файлах.");
        btn.textContent = "Сохранено ✓"; setTimeout(closeEditFaucet, 900);
    } catch (error) {
        console.error(error);
        showEditMessage((error.message || "Не удалось сохранить изменения.") + "\\nПри сетевой ошибке проверь четыре файла на GitHub: предыдущие шаги могли сохраниться.", true);
    } finally { btn.disabled = false; btn.textContent = "💾 Сохранить на GitHub"; }
}

function makeNewFaucetRow(name, num, url, reward, coin, seconds) {

    const coinLower = coin.toLowerCase();
    const commentName = name.replace(/--/g, "—").replace(/[<>]/g, "");

    return `<!-- Faucet ${num}: ${commentName} -->
<tr id="${id}" data-crypto="${safeCoin}">
<td><a class="faucet-link" href="${safeURL}" target="_blank" rel="noopener" onclick="startTimer('${id}', ${seconds})">${safeName}</a></td>
<td style="padding:0 4px;vertical-align:middle;width:1%;white-space:nowrap"><input type="text" inputmode="decimal" class="crypto-input" placeholder="0.00" value="${safeReward}" style="width:55px;height:20px;padding:2px;border:1px dashed #ccc;border-radius:3px;font-size:11px;text-align:center;transition:width .2s" onfocus="this.style.width='110px';this.style.border='1px solid #3498db'" onblur="this.style.width='55px';this.style.border='1px dashed #ccc'"></td>
<td style="padding:0 4px;vertical-align:middle;width:1%;white-space:nowrap"><span class="badge ${coinLower} crypto-badge" onclick="window.editBadge('${id}', this)">${safeCoin}</span></td>
<td style="padding:0 8px;vertical-align:middle;min-width:85px;white-space:nowrap"><span class="rub-result" id="rub_res_${id}" style="font-size:13px;font-weight:bold;color:#2ecc71">0.00 ₽</span></td>
<td><div class="timer-wrapper"><span class="timer-cell ready">Готов</span><button class="btn-reset" onclick="resetTimer('${id}')">✕</button><button class="btn-limit" onclick="toggleLimit('${id}')">⚠️</button></div></td>
</tr>`;
}

async function addFaucetRowToHtml(path, name, num, url, reward, coin, seconds) {
    const file = await githubGetFile(path);
    let source = file.content;
    const id = "faucet" + num;

    if (new RegExp(`\\bid=["']${id}["']`, "i").test(source)) {
        throw new Error(`ID ${id} уже существует в ${path}.`);
    }

    const doc = new DOMParser().parseFromString(source, "text/html");
    const duplicate = Array.from(doc.querySelectorAll('tr[id^="faucet"] a.faucet-link'))
        .some(link => link.textContent.trim().toLowerCase() === name.toLowerCase());

    if (duplicate) throw new Error(`Кран «${name}» уже есть в ${path}.`);

    const tbodyPattern = /(<tbody\b[^>]*class=["'][^"']*\bleft-faucets\b[^"']*["'][^>]*>)([\s\S]*?)(<\/tbody>)/i;
    const match = source.match(tbodyPattern);
    if (!match) throw new Error(`Не найден tbody.left-faucets в ${path}.`);

    const rowHTML = makeNewFaucetRow(name, num, url, reward, coin, seconds);
    source = source.replace(tbodyPattern, () => match[1] + match[2].replace(/\s*$/, "\n") + rowHTML + "\n" + match[3]);

    await githubPutFile(path, source, file.sha, `Add faucet ${num}: ${name}`);
}

async function addFaucetToIndex() {
    const token = localStorage.getItem("git_admin_token");
    if (!token) { setAddFaucetMessage("Сессия админки истекла. Войди заново.", true); return; }

    const name = document.getElementById("newFaucetName").value.trim();
    const numText = document.getElementById("newFaucetId").value.trim();
    const urlText = document.getElementById("newFaucetUrl").value.trim();
    const reward = document.getElementById("newFaucetReward").value.trim();
    const coin = document.getElementById("newFaucetCoin").value.trim().toUpperCase();
    const timeText = document.getElementById("newFaucetTime").value.trim();

    if (!name || !numText || !urlText || !reward || !coin || !timeText) {
        setAddFaucetMessage("Заполни все шесть полей.", true); return;
    }

    const num = Number(numText);
    const minutes = Number(timeText);

    if (!Number.isSafeInteger(num) || num < 1) {
        setAddFaucetMessage("ID должен быть целым положительным числом.", true); return;
    }
    if (!Number.isFinite(minutes) || minutes < 0) {
        setAddFaucetMessage("Укажи корректное время таймера.", true); return;
    }
    if (!/^[A-Z0-9._-]+$/.test(coin)) {
        setAddFaucetMessage("В валюте используй латинские буквы, цифры, точку, дефис или подчёркивание.", true); return;
    }

    let parsedURL;
    try { parsedURL = new URL(urlText); }
    catch (_) { setAddFaucetMessage("Укажи корректную ссылку на кран.", true); return; }

    if (!["https:", "http:"].includes(parsedURL.protocol)) {
        setAddFaucetMessage("Ссылка должна начинаться с http:// или https://.", true); return;
    }

    const button = document.getElementById("addFaucetButton");
    button.disabled = true;
    button.textContent = "Добавляю в обе версии...";
    setAddFaucetMessage("");

    try {
        if (FAUCETS.some(faucet => String(faucet.id) === String(num))) {
            throw new Error(`ID faucet${num} уже есть в основной базе.`);
        }

        const seconds = Math.round(minutes * 60);

        await addFaucetRowToHtml(INDEX_FILE_PATH, name, num, parsedURL.href, reward, coin, seconds);
        await addFaucetRowToHtml(DRIPS_INDEX_FILE_PATH, name, num, parsedURL.href, reward, coin, seconds);

        const timestamp = new Date().toISOString();
        const updateSettings = content => {
            content.faucet_settings = content.faucet_settings && typeof content.faucet_settings === "object"
                ? content.faucet_settings : {};

            content.faucet_settings[String(num)] = {
                ...(content.faucet_settings[String(num)] || {}),
                name, url: parsedURL.href, reward, coin, minutes, _updated_at: timestamp
            };
            content.last_updated = timestamp;
            return content;
        };

        await updateJsonFile(FILE_PATH, updateSettings, `Add faucet settings ${num}: ${name}`);
        await updateJsonFile(DRIPS_FILE_PATH, updateSettings, `Add faucet settings ${num}: ${name}`);

        FAUCETS.push({ id: String(num), name, url: parsedURL.href, reward, coin, minutes });
        normalizeDisabledFaucets();
        markStatsUpdated(timestamp);
        renderAdminList();
        updateFaucetStats();

        setAddFaucetMessage(`Готово! «${name}» (ID ${num}) добавлен в index.html, drips.html, status.json и drips.json.\nОбнови обе страницы после публикации GitHub Pages.`);

        ["newFaucetName", "newFaucetUrl", "newFaucetReward", "newFaucetCoin", "newFaucetTime"]
            .forEach(id => document.getElementById(id).value = "");

        document.getElementById("newFaucetId").value = String(num + 1);
    } catch (error) {
        console.error("Ошибка добавления крана:", error);
        setAddFaucetMessage((error.message || "Неизвестная ошибка.") + "\nПроверь обе версии и оба JSON: при сетевой ошибке предыдущие шаги могли сохраниться.", true);
    } finally {
        button.disabled = false;
        button.textContent = "➕ Добавить кран в обе версии";
    }
}

document.getElementById("newFaucetCoin").addEventListener("input", function() {
    this.value = this.value.toUpperCase();
});
document.getElementById("addFaucetButton").addEventListener("click", addFaucetToIndex);

 // =========================================================
// FAUCETPAY SCANNER (admin2)
// =========================================================
const SCAN_API = "http://127.0.0.1:8082";
let FOUND_FAUCETS = [];
let EDITING_FOUND_INDEX = -1;

function fpSetStatus(text, color) {
    const el = document.getElementById("fpStatus");
    if (!el) return;
    el.textContent = text;
    el.style.color = color || "#aab4c2";
}

document.getElementById("fpScanButton")?.addEventListener("click", scanFaucetPay);

async function scanFaucetPay() {
    const btn = document.getElementById("fpScanButton");
    if (!btn) return;

    btn.disabled = true;
    fpSetStatus("Сканирую 22 валюты... Это может занять 2–5 минут.", "#ffcc00");

    try {
        const response = await fetch(SCAN_API + "/faucetpay-faucets", { cache: "no-store" });
        const data = await response.json().catch(() => ({}));

        if (!data || data.ok !== true) {
            if (data && data.error === "login_required") {
                fpSetStatus("Ошибка парсинга — нужен логин FaucetPay. Нажмите «Войти в FaucetPay», залогиньтесь, закройте вкладку, обновите F5 и повторите.", "#ff7777");
            } else {
                fpSetStatus("Ошибка: " + (data && data.error || "неизвестная"), "#ff7777");
            }
            return;
        }

        FOUND_FAUCETS = Array.isArray(data.faucets) ? data.faucets : [];
        fpSetStatus("Найдено уникальных кранов: " + FOUND_FAUCETS.length, "#35d05b");
        renderFound();
    } catch (e) {
        fpSetStatus("Не удалось связаться с программой. Запущен ли Admin.exe? (" + e.message + ")", "#ff7777");
    } finally {
        btn.disabled = false;
    }
}

function renderFound() {
    const panel = document.getElementById("foundPanel");
    const list = document.getElementById("foundList");
    const count = document.getElementById("foundCount");
    if (!panel || !list || !count) return;

    panel.classList.remove("hidden");
    count.textContent = String(FOUND_FAUCETS.length);
    list.replaceChildren();

    if (!FOUND_FAUCETS.length) {
        list.innerHTML = '<p class="found-empty">Список пуст.</p>';
        return;
    }

    FOUND_FAUCETS.forEach((f, index) => {
        const item = document.createElement("div");
        item.className = "found-item";

        const name = document.createElement("span");
        name.className = "found-name";
        const faucetUrl = foundUrl(f);
        const anchor = document.createElement("a");
        anchor.href = faucetUrl || "#"; anchor.target = "_blank"; anchor.rel = "noopener noreferrer";
        anchor.textContent = f.name || f.domain || "—";
        if (!faucetUrl) anchor.addEventListener("click", e => e.preventDefault());
        name.appendChild(anchor);

        const coin = document.createElement("span");
        coin.className = "found-coin";
        coin.textContent = (f.coin || "").toUpperCase();

        const actions = document.createElement("div");
        actions.className = "found-actions";

        const addBtn = document.createElement("button");
        addBtn.type = "button"; addBtn.className = "add-to-main"; addBtn.textContent = "➕ Добавить";
        addBtn.addEventListener("click", () => addFoundFaucet(index, addBtn));
        actions.appendChild(addBtn);
        item.append(name, coin, actions);
        list.appendChild(item);
    });
}

function normHost(value) {
    let v = String(value || "").trim().toLowerCase(); if (!v) return "";
    try { v = new URL(v.includes("://") ? v : "https://" + v).hostname; } catch (_) { v = v.replace(/^https?:\/\//,"").split("/")[0].replace(/:\\d+$/,""); }
    return v.replace(/^www\./,"");
}
function foundUrl(f) {
    const raw = String(f?.url || f?.link || "").trim();
    try { const u = new URL(raw); if (["http:","https:"].includes(u.protocol)) return u.href; } catch (_) {}
    const host = normHost(f?.domain || raw); return host ? "https://" + host : "";
}
function knownHosts() { return new Set(FAUCETS.map(f => normHost(f.url)).filter(Boolean)); }
document.getElementById("compareBtn")?.addEventListener("click", () => {
    const before = FOUND_FAUCETS.length, known = knownHosts();
    FOUND_FAUCETS = FOUND_FAUCETS.filter(f => { const h = normHost(f.domain || f.url || f.link); return !h || !known.has(h); });
    fpSetStatus("Сравнение: было " + before + ", осталось новых " + FOUND_FAUCETS.length, "#35d05b"); renderFound();
});
document.getElementById("addFoundAllBtn")?.addEventListener("click", addAllFoundFaucets);
async function nextFreeId() {
    const files = await Promise.all([githubGetFile(INDEX_FILE_PATH), githubGetFile(DRIPS_INDEX_FILE_PATH)]);
    const used = new Set();
    for (const file of files) {
        const doc = new DOMParser().parseFromString(file.content, "text/html");
        doc.querySelectorAll('tr[id^="faucet"]').forEach(r => { const m=r.id.match(/^faucet(\d+)$/); if(m) used.add(Number(m[1])); });
    }
    let id=1; while(used.has(id)) id++; return id;
}
async function importFound(f, id) {
    const name=String(f.name || f.domain || "").trim(), url=foundUrl(f);
    if(!name || !url) throw new Error("Нет названия или ссылки у найденного крана.");
    await addFaucetRowToHtml(INDEX_FILE_PATH,name,id,url,"","",0);
    await addFaucetRowToHtml(DRIPS_INDEX_FILE_PATH,name,id,url,"","",0);
    const stamp=new Date().toISOString();
    const updater=c=>{ c.faucet_settings=c.faucet_settings && typeof c.faucet_settings==="object" ? c.faucet_settings : {}; c.faucet_settings[String(id)]={name,url,reward:"",coin:"",minutes:0,_updated_at:stamp}; c.last_updated=stamp; return c; };
    await updateJsonFile(FILE_PATH,updater,"Import faucet "+id+": "+name);
    await updateJsonFile(DRIPS_FILE_PATH,updater,"Import faucet "+id+": "+name);
    FAUCETS.push({id:String(id),name,url,reward:"",coin:"",minutes:0}); markStatsUpdated(stamp);
}
async function addFoundFaucet(index, button) {
    const f=FOUND_FAUCETS[index]; if(!f)return;
    if(button){button.disabled=true;button.textContent="Добавляю…";}
    try {
        const h=normHost(f.domain || f.url || f.link); if(h && knownHosts().has(h)) throw new Error("Этот домен уже есть в основном списке.");
        const id=await nextFreeId(); await importFound(f,id); FOUND_FAUCETS.splice(index,1);
        normalizeDisabledFaucets(); renderAdminList(); updateFaucetStats(); renderFound();
        fpSetStatus("«"+(f.name||f.domain)+"» добавлен в обе версии с ID "+id+". Остальные параметры заполни через «Изменить».","#35d05b");
    } catch(e){fpSetStatus("Не удалось добавить: "+e.message,"#ff7777");if(button){button.disabled=false;button.textContent="➕ Добавить";}}
}
async function addAllFoundFaucets() {
    const btn=document.getElementById("addFoundAllBtn"); if(!FOUND_FAUCETS.length)return; btn.disabled=true;
    const batch=[...FOUND_FAUCETS]; let added=0, skipped=0;
    try {
        for(const f of batch){
            const h=normHost(f.domain || f.url || f.link); if(h && knownHosts().has(h)){skipped++;continue;}
            const id=await nextFreeId(); await importFound(f,id); added++;
        }
        const known=knownHosts(); FOUND_FAUCETS=FOUND_FAUCETS.filter(f=>{const h=normHost(f.domain||f.url||f.link);return !h||!known.has(h);});
        normalizeDisabledFaucets();renderAdminList();updateFaucetStats();renderFound();
        fpSetStatus("Добавлено: "+added+". Уже известных пропущено: "+skipped+". Осталось новых: "+FOUND_FAUCETS.length+".","#35d05b");
    } catch(e){fpSetStatus("Добавлено до ошибки: "+added+". "+e.message+". Проверь четыре файла на GitHub.","#ff7777");}
    finally{btn.disabled=false;}
}
function openEditFound(index) { alert("Сначала нажми «Добавить», затем используй обычное «Изменить» в основном списке."); }
