 
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лимиты FaucetPay — CryptoFaucet Hub</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #101522;
  color: #e8edf7;
  font-family: Arial, sans-serif;
}

.container { max-width: 1200px; margin: auto; }
h1 { font-size: 26px; }

.info {
  color: #aab6cc;
  margin: 12px 0;
}

button {
  padding: 10px 16px;
  border: 0;
  border-radius: 8px;
  background: #3678f5;
  color: white;
  cursor: pointer;
}

button:disabled { opacity: 0.6; cursor: wait; }

.status {
  margin: 14px 0;
  color: #aab6cc;
  overflow-wrap: anywhere;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid #303b50;
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
  background: #171f30;
}

th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #303b50;
  text-align: left;
  white-space: nowrap;
}

th { background: #222e43; color: #9fc1ff; }
tr:last-child td { border-bottom: 0; }
.num { font-family: Consolas, monospace; }
.coin-name { font-weight: bold; }
.ticker { color: #9fc1ff; font-weight: bold; }

.usd-value {
  display: block;
  margin-top: 4px;
  color: #48d597;
  font-family: Arial, sans-serif;
  font-size: 11px;
  line-height: 1.3;
}

@media (max-width: 600px) {
  body { padding: 12px; }
  h1 { font-size: 22px; }
  th, td { padding: 10px 8px; }
  .usd-value { font-size: 10px; }
}
</style>
</head>

<body>
<div class="container">
  <h1>Лимиты и комиссии FaucetPay</h1>

  <p class="info">
    Данные публичной страницы FaucetPay.
    Зелёным показан приблизительный эквивалент в долларах США.
  </p>

  <button id="refreshBtn" type="button">Обновить данные</button>
  <div class="status" id="status">Загрузка данных...</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Монета</th>
          <th>Тикер</th>
          <th>Сеть</th>
          <th>Обычная комиссия</th>
          <th>Мин. вывод</th>
          <th>Приоритетная комиссия</th>
          <th>Мин. вывод</th>
        </tr>
      </thead>
      <tbody id="feesBody">
        <tr><td colspan="7">Ожидание данных...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const FEES_URL = 'https://proxy.cors.dev/https://faucetpay.io/fees';

const statusEl = document.getElementById('status');
const bodyEl = document.getElementById('feesBody');
const refreshBtn = document.getElementById('refreshBtn');

function cleanText(value) {
  return (value || '').replace(/\s+/g, ' ').trim();
}

// Читаем курсы, которые уже сохранил калькулятор на index.html.
function getCryptoRatesUSD() {
  try {
    return JSON.parse(localStorage.getItem('cryptoRatesUSD') || '{}');
  } catch (error) {
    console.warn('Не удалось прочитать сохранённые курсы:', error);
    return {};
  }
}

function formatUSD(amount, ticker, rates) {
  const rate = Number(rates[ticker]);

  if (!Number.isFinite(amount) ||
      !Number.isFinite(rate) ||
      amount < 0 ||
      rate <= 0) {
    return '—';
  }

  const value = amount * rate;

  if (!Number.isFinite(value)) return '—';

  // Для очень маленьких значений показываем больше знаков,
  // чтобы результат не превратился в $0.00.
  let decimals = 2;
  if (value > 0 && value < 0.01) decimals = 6;
  if (value > 0 && value < 0.000001) decimals = 10;

  return '$' + value.toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: decimals
  });
}

function addUsdValue(cell, amountText, ticker) {
  const amount = Number(String(amountText).replace(/,/g, '').trim());
  const rates = getCryptoRatesUSD();

  const usd = document.createElement('span');
  usd.className = 'usd-value';
  usd.textContent = Number.isFinite(amount)
    ? formatUSD(amount, ticker, rates)
    : '—';

  cell.appendChild(usd);
}

// Пересчитываем значения по последним курсам в localStorage.
function refreshUsdValues() {
  const rates = getCryptoRatesUSD();

  bodyEl.querySelectorAll('tr[data-ticker]').forEach(row => {
    const ticker = row.dataset.ticker;
    const cells = row.querySelectorAll('td');

    // Колонки 3–6 содержат комиссию и минимальные суммы.
    [3, 4, 5, 6].forEach(index => {
      const cell = cells[index];
      if (!cell) return;

      const usdEl = cell.querySelector('.usd-value');
      if (!usdEl) return;

      const amount = Number(cell.dataset.amount);
      usdEl.textContent = formatUSD(amount, ticker, rates);
    });
  });
}

async function loadFees() {
  refreshBtn.disabled = true;
  statusEl.textContent = 'Получаем данные с FaucetPay...';

  try {
    const response = await fetch(FEES_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);

    const html = await response.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const rows = [...doc.querySelectorAll('table tbody tr')];

    if (!rows.length) throw new Error('Таблица комиссий не найдена');

    const data = rows.map(row => {
      const cells = [...row.querySelectorAll('th, td')]
        .map(cell => cleanText(cell.innerText || cell.textContent));

      if (cells.length < 6) return null;

      const coinCell = row.querySelector('td');
      const img = coinCell?.querySelector('img[alt]');
      const coinInfo = img?.nextElementSibling;
      const infoDivs = coinInfo?.children;

      const name = cleanText(infoDivs?.[0]?.textContent);
      const ticker = cleanText(img?.alt).toUpperCase();

      if (!name || !ticker) {
        return {
          name: cells[0],
          ticker: '',
          network: cells[1],
          normalFee: cells[2],
          normalMin: cells[3],
          priorityFee: cells[4],
          priorityMin: cells[5]
        };
      }

      return {
        name,
        ticker,
        network: cells[1],
        normalFee: cells[2],
        normalMin: cells[3],
        priorityFee: cells[4],
        priorityMin: cells[5]
      };
    }).filter(Boolean);

    if (!data.length) throw new Error('Не удалось прочитать строки таблицы');

    const fragment = document.createDocumentFragment();

    data.forEach(item => {
      const tr = document.createElement('tr');
      tr.dataset.ticker = item.ticker;

      const values = [
        item.name,
        item.ticker,
        item.network,
        item.normalFee,
        item.normalMin,
        item.priorityFee,
        item.priorityMin
      ];

      values.forEach((value, index) => {
        const td = document.createElement('td');
        td.textContent = value;

        if (index === 0) td.className = 'coin-name';
        if (index === 1) td.className = 'ticker';

        if (index >= 3) {
          td.classList.add('num');

          const amount = Number(String(value).replace(/,/g, '').trim());
          td.dataset.amount = Number.isFinite(amount) ? String(amount) : 'NaN';

          const usd = document.createElement('span');
          usd.className = 'usd-value';
          usd.textContent = formatUSD(amount, item.ticker, getCryptoRatesUSD());
          td.appendChild(usd);
        }

        tr.appendChild(td);
      });

      fragment.appendChild(tr);
    });

    bodyEl.replaceChildren(fragment);

    const rates = getCryptoRatesUSD();
    const available = data.filter(item => Number(rates[item.ticker]) > 0).length;

    statusEl.textContent =
      'Загружено монет: ' + data.length +
      '. Курсы найдены для: ' + available +
      '. Обновлено: ' + new Date().toLocaleString('ru-RU');

  } catch (error) {
    console.error('Ошибка загрузки FaucetPay:', error);
    statusEl.textContent =
      'Ошибка загрузки: ' + error.message +
      '. Нажми «Обновить данные» и попробуй ещё раз.';
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener('click', loadFees);

// Обновляем долларовые значения, когда курсы меняются в localStorage.
window.addEventListener('storage', event => {
  if (event.key === 'cryptoRatesUSD') refreshUsdValues();
});

// Повторная проверка курсов на случай, если index.html ещё загружает API.
setInterval(refreshUsdValues, 5000);

loadFees();
</script>
</body>
</html>
