 
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лимиты FaucetPay — CryptoFaucet Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101522;
  color: #e8edf7;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1200px;
  margin: auto;
}

h1 {
  font-size: 26px;
}

.info {
  color: #aab6cc;
  margin: 12px 0;
}

button {
  padding: 10px 16px;
  border: 0;
  border-radius: 8px;
  background: #3678f5;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.status {
  margin: 14px 0;
  color: #aab6cc;
  overflow-wrap: anywhere;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid #303b50;
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
  background: #171f30;
}

th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #303b50;
  text-align: left;
  white-space: nowrap;
}

th {
  background: #222e43;
  color: #9fc1ff;
}

tr:last-child td {
  border-bottom: 0;
}

.num {
  font-family: Consolas, monospace;
}

.coin-name {
  font-weight: bold;
}

.ticker {
  color: #9fc1ff;
  font-weight: bold;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  h1 {
    font-size: 22px;
  }

  th, td {
    padding: 10px 8px;
  }
}
</style>
</head>

<body>
<div class="container">

  <h1>Лимиты и комиссии FaucetPay</h1>

  <p class="info">
    Данные публичной страницы FaucetPay.
    Вход в аккаунт не требуется.
  </p>

  <button id="refreshBtn" type="button">
    Обновить данные
  </button>

  <div class="status" id="status">
    Загрузка данных...
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Монета</th>
          <th>Тикер</th>
          <th>Сеть</th>
          <th>Обычная комиссия</th>
          <th>Мин. вывод</th>
          <th>Приоритетная комиссия</th>
          <th>Мин. вывод</th>
        </tr>
      </thead>

      <tbody id="feesBody">
        <tr>
          <td colspan="7">Ожидание данных...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

 
<script>
const FEES_URL = 'https://proxy.cors.dev/https://faucetpay.io/fees';

const statusEl = document.getElementById('status');
const bodyEl = document.getElementById('feesBody');
const refreshBtn = document.getElementById('refreshBtn');

function cleanText(value) {
  return (value || '').replace(/\s+/g, ' ').trim();
}

async function loadFees() {
  refreshBtn.disabled = true;
  statusEl.textContent = 'Получаем данные с FaucetPay...';

  try {
    const response = await fetch(FEES_URL, { cache: 'no-store' });

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const html = await response.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const rows = [...doc.querySelectorAll('table tbody tr')];

    if (!rows.length) {
      throw new Error('Таблица комиссий не найдена');
    }

    const data = rows.map(row => {
      const cells = [...row.querySelectorAll('th, td')]
        .map(cell => cleanText(cell.innerText || cell.textContent));

      if (cells.length < 6) return null;

      const coinCell = row.querySelector('td');
      const innerDivs = coinCell
        ? coinCell.querySelectorAll(':scope > div > div')
        : [];

      const name = cleanText(innerDivs[0]?.textContent);
      const ticker = cleanText(innerDivs[1]?.textContent);

      if (!name || !ticker) {
        return {
          name: cells[0],
          ticker: '',
          network: cells[1],
          normalFee: cells[2],
          normalMin: cells[3],
          priorityFee: cells[4],
          priorityMin: cells[5]
        };
      }

      return {
        name,
        ticker,
        network: cells[1],
        normalFee: cells[2],
        normalMin: cells[3],
        priorityFee: cells[4],
        priorityMin: cells[5]
      };
    }).filter(Boolean);

    if (!data.length) {
      throw new Error('Не удалось прочитать строки таблицы');
    }

    const fragment = document.createDocumentFragment();

    data.forEach(item => {
      const tr = document.createElement('tr');
      const values = [
        item.name,
        item.ticker.toUpperCase(),
        item.network,
        item.normalFee,
        item.normalMin,
        item.priorityFee,
        item.priorityMin
      ];

      values.forEach((value, index) => {
        const td = document.createElement('td');
        td.textContent = value;

        if (index === 0) td.className = 'coin-name';
        if (index === 1) td.className = 'ticker';
        if (index >= 3) td.classList.add('num');

        tr.appendChild(td);
      });

      fragment.appendChild(tr);
    });

    bodyEl.replaceChildren(fragment);
    statusEl.textContent =
      'Загружено монет: ' + data.length +
      '. Обновлено: ' + new Date().toLocaleString('ru-RU');

  } catch (error) {
    console.error('Ошибка загрузки FaucetPay:', error);
    statusEl.textContent =
      'Ошибка загрузки: ' + error.message +
      '. Нажми «Обновить данные» и попробуй ещё раз.';
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener('click', loadFees);
loadFees();
</script>

</body>
</html>
