 
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoFaucet Hub — Чат</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#10141c; --panel:#19212d; --panel2:#202b3a;
  --border:#303d50; --text:#e8edf5; --muted:#91a0b5;
  --blue:#2878e8; --green:#36b779; --red:#dc6262;
}
* {box-sizing:border-box}
body {
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;height:100vh;overflow:hidden
}
button,input {font:inherit}
button {
  cursor:pointer;border:0;border-radius:7px;padding:9px 13px;
  color:white;background:var(--blue)
}
button:hover {filter:brightness(1.12)}
button:disabled {opacity:.45;cursor:default}
input {
  width:100%;background:#111925;border:1px solid var(--border);
  border-radius:7px;color:var(--text);padding:11px;outline:none
}
input:focus {border-color:var(--blue)}
.hidden {display:none!important}
.muted {color:var(--muted)}
.small {font-size:12px}
.btn-green {background:#237e56}
.btn-red {background:#a94343}
.btn-gray {background:#46566c}

#authScreen {
  height:100vh;display:flex;justify-content:center;
  align-items:center;padding:18px
}
.auth-box {
  width:100%;max-width:390px;background:var(--panel);
  border:1px solid var(--border);border-radius:13px;padding:25px
}
.auth-box h2 {margin:0 0 8px}
.auth-box input {margin:8px 0}
.auth-box button {width:100%;margin-top:9px}
#authMessage {margin-top:12px;line-height:1.4}

#app {height:100vh;display:flex;flex-direction:column}
header {
  height:58px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 18px;
  background:#151d28;border-bottom:1px solid var(--border)
}
header strong {font-size:17px}
.header-right {display:flex;align-items:center;gap:12px}

#layout {flex:1;min-height:0;display:flex}
#sidebar {
  width:310px;min-width:260px;background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0
}
#myProfile {padding:14px;border-bottom:1px solid var(--border)}
#myProfile strong {font-size:15px}
#myProfile .muted {margin-top:4px}
.tabs {
  display:flex;padding:9px;gap:5px;border-bottom:1px solid var(--border)
}
.tabs button {
  flex:1;padding:9px 5px;font-size:12px;
  background:var(--panel2);color:var(--muted)
}
.tabs button.active {background:var(--blue);color:white}
#sideContent {overflow-y:auto;min-height:0;flex:1;padding:10px}
.section-title {color:var(--muted);font-size:12px;margin:5px 0 10px}
.person {
  display:flex;align-items:center;gap:9px;padding:10px;
  border-radius:8px;margin-bottom:5px;background:#202a38;
  cursor:pointer;min-width:0
}
.person:hover {background:#29384b}
.person.selected {background:#294b75}
.person-info {min-width:0;flex:1}
.person-name {
  font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.person-nick {font-size:11px;color:var(--muted);margin-top:3px}
.person-actions {display:flex;gap:5px;flex-shrink:0}
.person-actions button {padding:6px 8px;font-size:11px}

#main {flex:1;min-width:0;display:flex;flex-direction:column}
#emptyState {margin:auto;text-align:center;color:var(--muted);padding:20px}
#chatHeader {
  height:58px;flex-shrink:0;display:flex;align-items:center;
  padding:0 18px;border-bottom:1px solid var(--border);
  background:#151d28;gap:12px
}
#chatHeader strong {font-size:15px;flex:1}
#messages {
  flex:1;min-height:0;overflow-y:auto;padding:15px 18px;
  display:flex;flex-direction:column;align-items:flex-start;gap:7px
}
.message {
  max-width:min(78%,650px);min-width:70px;padding:9px 12px 6px;
  border-radius:10px;background:#303b4c;color:#edf2fa;
  overflow-wrap:anywhere;align-self:flex-start
}
.message.mine {background:#185db5;align-self:flex-start}
.message-text {font-size:14px;line-height:1.4;white-space:pre-wrap}
.message-time {font-size:10px;opacity:.7;text-align:right;margin-top:4px}
#sendArea {
  display:flex;gap:9px;padding:12px 15px;
  border-top:1px solid var(--border);background:#151d28
}
#messageInput {flex:1;min-width:0}
#sendButton {min-width:85px}
#notice {padding:8px 12px;font-size:12px;color:var(--muted);min-height:28px}
#mobileBack {display:none}

/* Панель звонка */
#callPanel {
  position:fixed;z-index:1000;right:20px;bottom:20px;
  width:min(340px,calc(100vw - 30px));
  background:#1b2635;border:1px solid #40516a;
  border-radius:14px;padding:18px;
  box-shadow:0 12px 45px #0009
}
#callPanel h3 {margin:0 0 8px;font-size:18px}
#callStatus {font-size:13px;color:var(--muted);margin-bottom:16px}
.call-buttons {display:flex;gap:8px;flex-wrap:wrap}
.call-buttons button {flex:1;min-width:90px}
#callIcon {font-size:30px;margin-bottom:10px}
#remoteAudio {display:none}
#callPanel {
  width:min(480px,calc(100vw - 30px));
}

#videoArea {
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#080c12;
  border-radius:10px;
  overflow:hidden;
  margin:12px 0;
}

#remoteVideo {
  width:100%;
  height:100%;
  object-fit:contain;
}

#localVideo {
  position:absolute;
  right:10px;
  bottom:10px;
  width:28%;
  max-height:35%;
  object-fit:cover;
  border:2px solid white;
  border-radius:8px;
  background:#111;
}
@media(max-width:700px) {
  #sidebar {width:100%;min-width:0;border-right:0}
  #main {display:none}
  #layout.chat-open #sidebar {display:none}
  #layout.chat-open #main {display:flex}
  #mobileBack {display:inline-block}
  header {padding:0 12px}
  header strong {font-size:14px}
  .header-right {gap:6px}
  .header-right button {padding:7px 9px;font-size:12px}
  #messages {padding:12px}
  .message {max-width:88%}
  #callPanel {right:10px;bottom:10px}
}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <h2>CryptoFaucet Hub</h2>
    <div class="muted small">Вход в чат</div>
    <input id="displayName" placeholder="Отображаемое имя (при регистрации)">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">
    <button id="loginButton">Войти</button>
    <button id="registerButton" class="btn-green">Регистрация</button>
    <div id="authMessage" class="small muted"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <strong>CryptoFaucet Hub — Чат</strong>
    <div class="header-right">
      <span id="headerNick" class="small muted"></span>
      <button id="logoutButton" class="btn-gray">Выйти</button>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div id="myProfile">
        <strong id="myName">Пользователь</strong>
        <div id="myNick" class="muted small"></div>
      </div>

      <div class="tabs">
        <button class="active" data-tab="friends">Друзья</button>
        <button data-tab="search">Поиск</button>
        <button data-tab="requests">Заявки <span id="requestCount"></span></button>
      </div>

      <div id="sideContent">
        <div id="friendsPanel">
          <div class="section-title">МОИ ДРУЗЬЯ</div>
          <div id="friendsList"></div>
        </div>

        <div id="searchPanel" class="hidden">
          <div class="section-title">ПОИСК ПО НИКУ</div>
          <input id="searchInput" placeholder="Например: @fakker">
          <div id="searchResults" style="margin-top:12px"></div>
        </div>

        <div id="requestsPanel" class="hidden">
          <div class="section-title">ВХОДЯЩИЕ ЗАЯВКИ</div>
          <div id="incomingRequests"></div>
          <div class="section-title" style="margin-top:20px">ОТПРАВЛЕННЫЕ ЗАЯВКИ</div>
          <div id="outgoingRequests"></div>
        </div>
      </div>
    </aside>

    <main id="main">
      <div id="emptyState">
        <div style="font-size:35px;margin-bottom:10px">💬</div>
        Выбери друга, чтобы начать переписку
      </div>

      <div id="chatHeader" class="hidden">
        <button id="mobileBack" class="btn-gray">←</button>
        <strong id="chatPersonName"></strong>
         <button id="callAudioButton" title="Аудиозвонок">📞 Аудио</button>
<button id="callVideoButton" title="Видеозвонок">📹 Видео</button>
      </div>

      <div id="messages" class="hidden"></div>
      <div id="notice"></div>

      <div id="sendArea" class="hidden">
        <input id="messageInput" placeholder="Напиши сообщение..." maxlength="4000">
        <button id="sendButton">Отправить</button>
      </div>
    </main>
  </div>
</div>

 <div id="callPanel" class="hidden">
  <div id="callIcon">📞</div>
  <h3 id="callTitle">Звонок</h3>
  <div id="callStatus">Подготовка...</div>

  <div id="videoArea" class="hidden">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="call-buttons" id="incomingButtons">
    <button id="acceptCallButton" class="btn-green">Принять</button>
    <button id="rejectCallButton" class="btn-red">Отклонить</button>
  </div>

  <div class="call-buttons hidden" id="activeButtons">
    <button id="muteButton" class="btn-gray">🎙 Выключить микрофон</button>
    <button id="cameraButton" class="btn-gray hidden">📷 Выключить камеру</button>
    <button id="hangupButton" class="btn-red">Завершить</button>
  </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
const SUPABASE_URL = "https://quihcivmcbeznpltaojt.supabase.co";
const SUPABASE_KEY = "sb_publishable_YmDuDjBQDevwqIlQUfiIKQ_vNywFXBL";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let myProfile = null;
let activeFriend = null;
let allRequests = [];
let realtimeChannel = null;
let searchTimer = null;
let currentTab = "friends";
let appStarted = false;

/* Состояние аудиозвонка */
let activeCall = null;
let incomingCall = null;
let peerConnection = null;
let localStream = null;
let remoteIceQueue = [];
let answerApplied = false;
let callTimer = null;
let callSeconds = 0;
let muted = false;
let callPollTimer = null;
 let incomingCallPollTimer = null;
let icePollTimer = null;
let seenIceKeys = new Set();
let isVideoCall = false; 
 
const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}

function showAuthMessage(message, error = false) {
  $("authMessage").textContent = message;
  $("authMessage").style.color = error ? "#ff8585" : "#91a0b5";
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tabs button").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });
  $("friendsPanel").classList.toggle("hidden", tab !== "friends");
  $("searchPanel").classList.toggle("hidden", tab !== "search");
  $("requestsPanel").classList.toggle("hidden", tab !== "requests");
  if (tab === "friends") loadFriends();
  if (tab === "requests") renderRequests();
}

document.querySelectorAll(".tabs button").forEach(button => {
  button.addEventListener("click", () => setTab(button.dataset.tab));
});

async function register() {
  const email = $("email").value.trim();
  const password = $("password").value;
  const displayName = $("displayName").value.trim();

  if (!email || !password || !displayName) {
    showAuthMessage("Заполни имя, email и пароль.", true);
    return;
  }

  const { error } = await db.auth.signUp({
    email, password,
    options: { data: { display_name: displayName } }
  });

  if (error) {
    showAuthMessage(error.message, true);
    return;
  }

  showAuthMessage("Регистрация выполнена. Если требуется подтверждение email, проверь почту.");
}

async function login() {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    showAuthMessage("Введи email и пароль.", true);
    return;
  }

  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    showAuthMessage(error.message, true);
    return;
  }
  await startApp();
}

$("registerButton").addEventListener("click", register);
$("loginButton").addEventListener("click", login);

$("logoutButton").addEventListener("click", async () => {
  if (activeCall) await hangupCall();
  await db.auth.signOut();
  location.reload();
});

async function startApp() {
  if (appStarted) return;

  const { data: { user } } = await db.auth.getUser();
  if (!user) return;

  currentUser = user;

  const { data: profile, error } = await db
    .from("profiles")
    .select("id, username, display_name")
    .eq("id", user.id)
    .single();

  if (error) {
    alert("Не удалось загрузить профиль: " + error.message);
    return;
  }

  myProfile = profile;
  appStarted = true;

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  const displayName = profile.display_name || "Пользователь";
  const nick = profile.username ? "@" + profile.username : "Ник не задан";

  $("myName").textContent = displayName;
  $("myNick").textContent = nick;
  $("headerNick").textContent = nick;

   await loadRequests();
await loadFriends();
subscribeRealtime();
startIncomingCallPolling();
}

async function loadRequests() {
  const { data, error } = await db
    .from("friend_requests")
    .select("*")
    .or(`requester_id.eq.${currentUser.id},addressee_id.eq.${currentUser.id}`)
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Ошибка загрузки заявок:", error);
    return;
  }

  allRequests = data || [];
  renderRequests();

  $("requestCount").textContent = allRequests.some(
    r => r.addressee_id === currentUser.id && r.status === "pending"
  ) ? " •" : "";
}

async function getProfiles(ids) {
  const uniqueIds = [...new Set(ids)].filter(Boolean);
  if (!uniqueIds.length) return {};

  const { data, error } = await db
    .from("profiles")
    .select("id, username, display_name")
    .in("id", uniqueIds);

  if (error) {
    console.error("Ошибка загрузки пользователей:", error);
    return {};
  }

  return Object.fromEntries((data || []).map(p => [p.id, p]));
}

function personHtml(profile, actions = "", selected = false) {
  const name = escapeHtml(profile.display_name || "Пользователь");
  const nick = profile.username ? "@" + escapeHtml(profile.username) : "без ника";

  return `
    <div class="person ${selected ? "selected" : ""}" data-person="${profile.id}">
      <div class="person-info">
        <div class="person-name">${name}</div>
        <div class="person-nick">${nick}</div>
      </div>
      ${actions ? `<div class="person-actions">${actions}</div>` : ""}
    </div>`;
}

async function loadFriends() {
  if (!currentUser) return;

  const { data, error } = await db
    .from("friend_requests")
    .select("*")
    .eq("status", "accepted")
    .or(`requester_id.eq.${currentUser.id},addressee_id.eq.${currentUser.id}`);

  if (error) {
    $("friendsList").textContent = "Ошибка загрузки: " + error.message;
    return;
  }

  const friendIds = (data || []).map(r =>
    r.requester_id === currentUser.id ? r.addressee_id : r.requester_id
  );

  const profiles = await getProfiles(friendIds);

  if (!friendIds.length) {
    $("friendsList").innerHTML =
      '<div class="muted small">Пока нет друзей. Найди пользователя через вкладку «Поиск».</div>';
    return;
  }

  $("friendsList").innerHTML = friendIds
    .filter(id => profiles[id])
    .map(id => personHtml(profiles[id], "", activeFriend?.id === id))
    .join("");

  $("friendsList").querySelectorAll(".person").forEach(el => {
    el.addEventListener("click", () => {
      const friend = profiles[el.dataset.person];
      if (friend) openChat(friend);
    });
  });
}

async function searchUsers() {
  const query = $("searchInput").value.trim().replace(/^@/, "").toLowerCase();

  if (query.length < 2) {
    $("searchResults").innerHTML =
      '<div class="muted small">Введи минимум 2 символа ника.</div>';
    return;
  }

  const { data, error } = await db
    .from("profiles")
    .select("id, username, display_name")
    .ilike("username", `%${query}%`)
    .neq("id", currentUser.id)
    .limit(20);

  if (error) {
    $("searchResults").textContent = "Ошибка поиска: " + error.message;
    return;
  }

  if (!data.length) {
    $("searchResults").innerHTML = '<div class="muted small">Никого не нашёл.</div>';
    return;
  }

  $("searchResults").innerHTML = data.map(profile => {
    const existing = allRequests.find(r =>
      (r.requester_id === currentUser.id && r.addressee_id === profile.id) ||
      (r.addressee_id === currentUser.id && r.requester_id === profile.id)
    );

    let action = "";

    if (!existing) {
      action = `<button class="add-friend" data-id="${profile.id}">Добавить</button>`;
    } else if (existing.status === "accepted") {
      action = '<button class="btn-green" disabled>Друг</button>';
    } else if (existing.status === "pending" && existing.requester_id === currentUser.id) {
      action = '<button class="btn-gray" disabled>Отправлено</button>';
    } else if (existing.status === "pending") {
      action = '<button class="btn-gray" disabled>Есть заявка</button>';
    } else {
      action = '<button class="btn-gray" disabled>Заявка закрыта</button>';
    }

    return personHtml(profile, action);
  }).join("");

  $("searchResults").querySelectorAll(".add-friend").forEach(button => {
    button.addEventListener("click", () => sendFriendRequest(button.dataset.id));
  });
}

$("searchInput").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchUsers, 300);
});

async function sendFriendRequest(userId) {
  const { error } = await db.from("friend_requests").insert({
    requester_id: currentUser.id,
    addressee_id: userId,
    status: "pending"
  });

  if (error) {
    alert("Не удалось отправить заявку: " + error.message);
    return;
  }

  await loadRequests();
  await searchUsers();
}

async function renderRequests() {
  if (!currentUser) return;

  const incoming = allRequests.filter(r =>
    r.addressee_id === currentUser.id && r.status === "pending"
  );
  const outgoing = allRequests.filter(r =>
    r.requester_id === currentUser.id && r.status === "pending"
  );

  const profiles = await getProfiles([
    ...incoming.map(r => r.requester_id),
    ...outgoing.map(r => r.addressee_id)
  ]);

  $("incomingRequests").innerHTML = incoming.length
    ? incoming.map(r => {
        const p = profiles[r.requester_id];
        if (!p) return "";
        return personHtml(p, `
          <button class="btn-green accept-request" data-id="${r.id}">✓</button>
          <button class="btn-red reject-request" data-id="${r.id}">✕</button>
        `);
      }).join("")
    : '<div class="muted small">Новых заявок нет.</div>';

  $("outgoingRequests").innerHTML = outgoing.length
    ? outgoing.map(r => profiles[r.addressee_id]
        ? personHtml(profiles[r.addressee_id],
          '<button class="btn-gray" disabled>Ожидание</button>')
        : "").join("")
    : '<div class="muted small">Отправленных заявок нет.</div>';

  $("incomingRequests").querySelectorAll(".accept-request").forEach(button => {
    button.addEventListener("click", () => updateRequest(button.dataset.id, "accepted"));
  });
  $("incomingRequests").querySelectorAll(".reject-request").forEach(button => {
    button.addEventListener("click", () => updateRequest(button.dataset.id, "rejected"));
  });
}

async function updateRequest(requestId, status) {
  const { error } = await db
    .from("friend_requests")
    .update({ status })
    .eq("id", requestId)
    .eq("addressee_id", currentUser.id)
    .eq("status", "pending");

  if (error) {
    alert("Не удалось обновить заявку: " + error.message);
    return;
  }

  await loadRequests();
  await loadFriends();
}

async function openChat(friend) {
  activeFriend = friend;
  $("layout").classList.add("chat-open");
  $("emptyState").classList.add("hidden");
  $("chatHeader").classList.remove("hidden");
  $("messages").classList.remove("hidden");
  $("sendArea").classList.remove("hidden");

  $("chatPersonName").textContent =
    (friend.display_name || "Пользователь") +
    (friend.username ? "  @" + friend.username : "");

  await loadMessages();
  $("messageInput").focus();
}

async function loadMessages() {
  if (!activeFriend) return;

  const { data, error } = await db
    .from("messages")
    .select("id, sender_id, recipient_id, content, created_at")
    .or(
      `and(sender_id.eq.${currentUser.id},recipient_id.eq.${activeFriend.id}),and(sender_id.eq.${activeFriend.id},recipient_id.eq.${currentUser.id})`
    )
    .order("created_at", { ascending: true })
    .limit(300);

  if (error) {
    $("notice").textContent = "Ошибка загрузки сообщений: " + error.message;
    return;
  }

  $("notice").textContent = "";
  $("messages").innerHTML = (data || []).map(messageHtml).join("");
  scrollMessages();
}

function messageHtml(message) {
  const mine = message.sender_id === currentUser.id;
  const date = new Date(message.created_at);
  const time = date.toLocaleTimeString("ru-RU", {
    hour:"2-digit", minute:"2-digit"
  });

  return `
    <div class="message ${mine ? "mine" : ""}" data-message="${message.id}">
      <div class="message-text">${escapeHtml(message.content)}</div>
      <div class="message-time">${time}</div>
    </div>`;
}

function scrollMessages() {
  $("messages").scrollTop = $("messages").scrollHeight;
}

async function sendMessage() {
  if (!activeFriend) return;
  const content = $("messageInput").value.trim();
  if (!content) return;

  $("sendButton").disabled = true;

  const { error } = await db.from("messages").insert({
    sender_id: currentUser.id,
    recipient_id: activeFriend.id,
    content
  });

  $("sendButton").disabled = false;

  if (error) {
    alert("Не удалось отправить сообщение: " + error.message);
    return;
  }

  $("messageInput").value = "";
  await loadMessages();
  $("messageInput").focus();
}

$("sendButton").addEventListener("click", sendMessage);
$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

 /* ---------------- АУДИО И ВИДЕОЗВОНКИ WEBRTC ---------------- */

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

function showCallPanel(title, status, mode) {
  $("callPanel").classList.remove("hidden");
  $("callTitle").textContent = title;
  $("callStatus").textContent = status;

  $("incomingButtons").classList.toggle("hidden", mode !== "incoming");
  $("activeButtons").classList.toggle("hidden", mode !== "active");
}

function updateCallStatus(status) {
  $("callStatus").textContent = status;
}

function formatDuration(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, "0");
  const s = (seconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function startCallTimer() {
  if (callTimer) return;

  callSeconds = 0;

  callTimer = setInterval(() => {
    callSeconds++;
    updateCallStatus("Разговор: " + formatDuration(callSeconds));
  }, 1000);
}

async function getCallMedia(video = false) {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error("Браузер не поддерживает микрофон или камеру. Нужен HTTPS.");
  }

  return await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    },
    video: video ? {
      width: { ideal: 640 },
      height: { ideal: 480 },
      facingMode: "user"
    } : false
  });
}

function showLocalVideo() {
  if (!isVideoCall || !localStream) return;

  $("videoArea").classList.remove("hidden");
  $("localVideo").srcObject = localStream;
  $("cameraButton").classList.remove("hidden");
}

function showRemoteVideo() {
  $("videoArea").classList.remove("hidden");
}

 /* Проверка входящих звонков независимо от Realtime */

async function pollIncomingCalls() {
  if (!currentUser || activeCall) return;

  const { data: call, error } = await db
    .from("calls")
    .select("*")
    .eq("callee_id", currentUser.id)
    .eq("status", "ringing")
    .order("created_at", { ascending: false })
    .limit(1)
    .maybeSingle();

  if (error) {
    console.error("Ошибка поиска входящего звонка:", error);
    return;
  }

  if (!call) return;

  // Если это уже известный звонок — обновляем его данные.
  if (incomingCall && incomingCall.id === call.id) {
    incomingCall = call;
    await showIncomingCall(call);
    return;
  }

  // Не переключаемся на другой звонок во время текущего.
  if (incomingCall) return;

  incomingCall = call;
  seenIceKeys.clear();
  remoteIceQueue = [];

  const video = !!call.offer?.sdp?.includes("m=video");

  showCallPanel(
    video ? "📹 Входящий видеозвонок" : "📞 Входящий аудиозвонок",
    "Вам звонят!",
    "incoming"
  );

  $("acceptCallButton").disabled = !call.offer;

  startCallPolling();
  await showIncomingCall(call);
}

function startIncomingCallPolling() {
  clearInterval(incomingCallPollTimer);

  pollIncomingCalls();

  incomingCallPollTimer = setInterval(() => {
    pollIncomingCalls();
  }, 2000);
}
function startCallPolling() {
  clearInterval(callPollTimer);
  clearInterval(icePollTimer);

  callPollTimer = setInterval(pollCallState, 1200);
  icePollTimer = setInterval(pollRemoteIce, 1200);

  pollCallState();
  pollRemoteIce();
}

async function pollCallState() {
  const callId = activeCall?.id || incomingCall?.id;
  if (!callId) return;

  const { data, error } = await db
    .from("calls")
    .select("*")
    .eq("id", callId)
    .maybeSingle();

  if (error) {
    console.error("Ошибка проверки звонка:", error);
    return;
  }

  if (data) {
    handleCallChange({
      eventType: "UPDATE",
      new: data
    });
  }
}

async function pollRemoteIce() {
  const callId = activeCall?.id || incomingCall?.id;
  if (!callId) return;

  const { data, error } = await db
    .from("call_ice_candidates")
    .select("*")
    .eq("call_id", callId)
    .neq("user_id", currentUser.id);

  if (error) {
    console.error("Ошибка получения ICE:", error);
    return;
  }

  for (const row of data || []) {
    await receiveIceCandidate(row);
  }
}

function createPeerConnection(callId) {
  peerConnection = new RTCPeerConnection(rtcConfig);

  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  peerConnection.ontrack = event => {
    const stream = event.streams?.[0];

    if (!stream) return;

    if (isVideoCall) {
      $("remoteVideo").srcObject = stream;
      showRemoteVideo();

      $("remoteVideo").play().catch(() => {
        updateCallStatus("Нажми на страницу, чтобы разрешить видео.");
      });
    } else {
      $("remoteAudio").srcObject = stream;

      $("remoteAudio").play().catch(() => {
        updateCallStatus("Нажми на страницу, чтобы разрешить звук.");
      });
    }
  };

  peerConnection.onicecandidate = async event => {
    if (!event.candidate || !activeCall || activeCall.id !== callId) return;

    const { error } = await db
      .from("call_ice_candidates")
      .insert({
        call_id: callId,
        user_id: currentUser.id,
        candidate: event.candidate.toJSON()
      });

    if (error) console.error("Ошибка отправки ICE:", error);
  };

  peerConnection.onconnectionstatechange = () => {
    if (!peerConnection) return;

    const state = peerConnection.connectionState;

    if (state === "connected") {
      startCallTimer();
    } else if (state === "connecting") {
      updateCallStatus("Устанавливаем соединение...");
    } else if (state === "disconnected") {
      updateCallStatus("Связь прервана...");
    } else if (state === "failed") {
      updateCallStatus("Не удалось установить соединение.");
    }
  };

  return peerConnection;
}

async function receiveIceCandidate(row) {
  const callId = activeCall?.id || incomingCall?.id;

  if (!callId || row.call_id !== callId) return;
  if (row.user_id === currentUser.id) return;

  const key = JSON.stringify(row.candidate);
  if (seenIceKeys.has(key)) return;

  seenIceKeys.add(key);

  if (!activeCall || !peerConnection || !peerConnection.remoteDescription) {
    remoteIceQueue.push(row.candidate);
    return;
  }

  try {
    await peerConnection.addIceCandidate(
      new RTCIceCandidate(row.candidate)
    );
  } catch (error) {
    console.error("Ошибка добавления ICE:", error);
  }
}

async function flushRemoteIce() {
  if (!peerConnection?.remoteDescription) return;

  const queue = [...remoteIceQueue];
  remoteIceQueue = [];

  for (const candidate of queue) {
    try {
      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );
    } catch (error) {
      console.error("Ошибка ICE:", error);
    }
  }
}

async function startCall(video = false) {
  if (!activeFriend || activeCall || incomingCall) return;

  if (!window.isSecureContext) {
    alert("Для звонков нужен HTTPS.");
    return;
  }

  $("callAudioButton").disabled = true;
  $("callVideoButton").disabled = true;

  isVideoCall = video;
  seenIceKeys.clear();
  remoteIceQueue = [];

  try {
    showCallPanel(
      video ? "Видеозвонок" : "Аудиозвонок",
      "Запрашиваем " + (video ? "камеру и микрофон..." : "микрофон..."),
      "active"
    );

    localStream = await getCallMedia(video);

    if (video) showLocalVideo();

    const { data: call, error } = await db
      .from("calls")
      .insert({
        caller_id: currentUser.id,
        callee_id: activeFriend.id,
        status: "ringing"
      })
      .select()
      .single();

    if (error) throw error;

    activeCall = {
      id: call.id,
      role: "caller",
      caller_id: currentUser.id,
      callee_id: activeFriend.id,
      video
    };

    createPeerConnection(call.id);
    startCallPolling();

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    const { error: updateError } = await db
      .from("calls")
      .update({
        offer: peerConnection.localDescription.toJSON()
      })
      .eq("id", call.id);

    if (updateError) throw updateError;

    updateCallStatus("Вызов... Ожидаем ответа.");
  } catch (error) {
    console.error(error);

    alert("Не удалось начать звонок: " + error.message);

    if (activeCall) {
      await db.from("calls")
        .update({ status: "ended" })
        .eq("id", activeCall.id);
    }

    cleanupCall("Звонок не состоялся");
  } finally {
    $("callAudioButton").disabled = false;
    $("callVideoButton").disabled = false;
  }
}

$("callAudioButton").addEventListener("click", () => startCall(false));
$("callVideoButton").addEventListener("click", () => startCall(true));

async function showIncomingCall(row) {
  const callId = row.id;

  const profiles = await getProfiles([row.caller_id]);

  // Не используем устаревшие данные, если звонок уже изменился.
  if (!incomingCall || incomingCall.id !== callId) return;

  const latest = incomingCall;
  const caller = profiles[row.caller_id];
  const name = caller?.display_name || "Пользователь";

  const video = !!latest.offer?.sdp?.includes("m=video");

  showCallPanel(
    (video ? "📹 Видеозвонок: " : "📞 Аудиозвонок: ") + name,
    latest.offer ? "Вам звонят!" : "Ожидаем соединение...",
    "incoming"
  );

  $("acceptCallButton").disabled = !latest.offer;
}

async function acceptIncomingCall() {
  if (!incomingCall || !incomingCall.offer || activeCall) return;

  const call = incomingCall;

  isVideoCall = !!call.offer.sdp?.includes("m=video");

  activeCall = {
    id: call.id,
    role: "callee",
    caller_id: call.caller_id,
    callee_id: call.callee_id,
    video: isVideoCall
  };

  incomingCall = null;

  try {
    showCallPanel(
      isVideoCall ? "Видеозвонок" : "Аудиозвонок",
      "Запрашиваем " + (isVideoCall ? "камеру и микрофон..." : "микрофон..."),
      "active"
    );

    localStream = await getCallMedia(isVideoCall);

    if (isVideoCall) showLocalVideo();

    createPeerConnection(call.id);
    startCallPolling();

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(call.offer)
    );

    await flushRemoteIce();

    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    const { error } = await db
      .from("calls")
      .update({
        answer: peerConnection.localDescription.toJSON(),
        status: "accepted"
      })
      .eq("id", call.id);

    if (error) throw error;

    updateCallStatus("Соединение...");
  } catch (error) {
    console.error(error);

    alert("Не удалось принять звонок: " + error.message);

    await db.from("calls")
      .update({ status: "ended" })
      .eq("id", call.id);

    cleanupCall("Не удалось принять звонок");
  }
}

$("acceptCallButton").addEventListener("click", acceptIncomingCall);

async function rejectIncomingCall() {
  if (!incomingCall) return;

  const id = incomingCall.id;
  incomingCall = null;

  await db.from("calls")
    .update({ status: "rejected" })
    .eq("id", id);

  cleanupCall("Вызов отклонён");
}

$("rejectCallButton").addEventListener("click", rejectIncomingCall);

async function hangupCall() {
  if (!activeCall) return;

  const id = activeCall.id;

  await db.from("calls")
    .update({ status: "ended" })
    .eq("id", id);

  cleanupCall("Звонок завершён");
}

$("hangupButton").addEventListener("click", hangupCall);

$("muteButton").addEventListener("click", () => {
  if (!localStream) return;

  muted = !muted;

  localStream.getAudioTracks().forEach(track => {
    track.enabled = !muted;
  });

  $("muteButton").textContent = muted
    ? "🔇 Включить микрофон"
    : "🎙 Выключить микрофон";
});

$("cameraButton").addEventListener("click", () => {
  if (!localStream) return;

  const tracks = localStream.getVideoTracks();
  if (!tracks.length) return;

  const enabled = !tracks[0].enabled;

  tracks.forEach(track => {
    track.enabled = enabled;
  });

  $("cameraButton").textContent = enabled
    ? "📷 Выключить камеру"
    : "📷 Включить камеру";
});

function cleanupCall(message = "") {
  clearInterval(callTimer);
  clearInterval(callPollTimer);
  clearInterval(icePollTimer);

  callTimer = null;
  callPollTimer = null;
  icePollTimer = null;

  callSeconds = 0;
  answerApplied = false;
  remoteIceQueue = [];
  seenIceKeys.clear();

  incomingCall = null;
  activeCall = null;
  muted = false;
  isVideoCall = false;

  if (peerConnection) {
    peerConnection.ontrack = null;
    peerConnection.onicecandidate = null;
    peerConnection.close();
    peerConnection = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  $("remoteAudio").srcObject = null;
  $("remoteVideo").srcObject = null;
  $("localVideo").srcObject = null;

  $("videoArea").classList.add("hidden");
  $("cameraButton").classList.add("hidden");

  $("callPanel").classList.add("hidden");
  $("muteButton").textContent = "🎙 Выключить микрофон";
  $("cameraButton").textContent = "📷 Выключить камеру";

  if (message) $("notice").textContent = message;
}

function handleCallChange(payload) {
  const row = payload.new;
  if (!row || !currentUser) return;

  // Новый входящий вызов.
  if (
    payload.eventType === "INSERT" &&
    row.callee_id === currentUser.id &&
    row.status === "ringing"
  ) {
    if (activeCall || incomingCall) {
      db.from("calls")
        .update({ status: "rejected" })
        .eq("id", row.id);
      return;
    }

    incomingCall = row;
    seenIceKeys.clear();
    remoteIceQueue = [];

    showCallPanel(
      "Входящий звонок",
      "Ожидаем соединение...",
      "incoming"
    );

    $("acceptCallButton").disabled = !row.offer;

    startCallPolling();
    showIncomingCall(row);
    return;
  }

  // Обновление входящего вызова.
  if (
    incomingCall &&
    row.id === incomingCall.id &&
    row.callee_id === currentUser.id
  ) {
    incomingCall = row;

    $("acceptCallButton").disabled = !row.offer;

    if (row.offer) {
      const video = !!row.offer.sdp?.includes("m=video");

      $("callTitle").textContent = video
        ? "📹 Входящий видеозвонок"
        : "📞 Входящий аудиозвонок";

      updateCallStatus("Вам звонят!");
    }

    if (row.status === "ended" || row.status === "rejected") {
      cleanupCall("Вызов завершён");
    }

    return;
  }

  if (!activeCall || row.id !== activeCall.id) return;

  // Звонивший получил ответ.
  if (
    activeCall.role === "caller" &&
    row.status === "accepted" &&
    row.answer &&
    !answerApplied
  ) {
    answerApplied = true;

    (async () => {
      try {
        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(row.answer)
        );

        await flushRemoteIce();
        updateCallStatus("Соединение...");
      } catch (error) {
        console.error("Ошибка установки ответа:", error);
        updateCallStatus("Ошибка соединения: " + error.message);
      }
    })();

    return;
  }

  if (row.status === "rejected") {
    cleanupCall("Собеседник отклонил вызов");
  } else if (row.status === "ended") {
    cleanupCall("Собеседник завершил звонок");
  } else if (row.status === "missed") {
    cleanupCall("Пропущенный вызов");
  }
}

 /* ---------------- SUPABASE REALTIME ---------------- */

function subscribeRealtime() {
  // Удаляем старый канал, если он уже существовал.
  if (realtimeChannel) {
    db.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  realtimeChannel = db
    .channel("cryptofaucet-chat-" + currentUser.id)

    // Новые сообщения
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },
      async payload => {
        const message = payload.new;

        if (!activeFriend) return;

        const isOurConversation =
          (message.sender_id === currentUser.id &&
           message.recipient_id === activeFriend.id) ||
          (message.sender_id === activeFriend.id &&
           message.recipient_id === currentUser.id);

        if (isOurConversation) {
          await loadMessages();
        }
      }
    )

    // Звонки: создание и изменение
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "calls"
      },
      payload => {
        handleCallChange(payload);
      }
    )

    // ICE-кандидаты для WebRTC
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "call_ice_candidates"
      },
      payload => {
        if (payload.new) {
          receiveIceCandidate(payload.new);
        }
      }
    )

    // Заявки в друзья
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "friend_requests"
      },
      async () => {
        await loadRequests();
        await loadFriends();
      }
    )

    .subscribe((status, error) => {
      console.log("Supabase Realtime:", status);

      if (status === "SUBSCRIBED") {
        $("notice").textContent = "Соединение чата активно";
      }

      if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
        $("notice").textContent =
          "Ошибка соединения чата. Проверь подключение.";
        console.error("Realtime error:", error);
      }
    });
}
$("mobileBack").addEventListener("click", () => {
  $("layout").classList.remove("chat-open");
});

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) await startApp();
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session && !appStarted) {
    setTimeout(startApp, 0);
  }
});

init();
