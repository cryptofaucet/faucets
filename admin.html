 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления кранами</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        h1, h2 {
            text-align: center;
            color: #00ffcc;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #00ffcc;
            border: none;
            color: #1a1a1a;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #00ccaa; }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .hidden { display: none; }

        .add-faucet-panel {
            background: #222831;
            border: 1px solid #41414c;
            border-radius: 8px;
            padding: 18px;
            margin: 18px 0 24px;
        }

        .add-faucet-panel h2 {
            margin: 0 0 16px;
            color: #ff9900;
            font-size: 20px;
        }

        .add-faucet-row {
            display: grid;
            gap: 12px;
            margin-bottom: 12px;
        }

        .add-faucet-row-one {
            grid-template-columns: minmax(0, 2fr) 82px minmax(0, 2fr);
        }

        .add-faucet-row-two {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .add-faucet-panel .field { min-width: 0; }

        .add-faucet-panel label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 13px;
            font-weight: bold;
        }

        .add-faucet-panel input {
            width: 100%;
            min-width: 0;
            height: 38px;
            padding: 8px 9px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
        }

        .add-faucet-panel input:focus {
            outline: none;
            border-color: #ff9900;
        }

        .add-faucet-panel input::-webkit-outer-spin-button,
        .add-faucet-panel input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .add-faucet-panel input[type=number] {
            -moz-appearance: textfield;
        }

        #addFaucetButton {
            background: #ff9900;
            color: #1a1a1a;
            margin-top: 2px;
        }

        #addFaucetButton:hover { background: #e08800; }

        #addFaucetMessage {
            margin: 10px 0 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .add-faucet-row-one {
                grid-template-columns: minmax(0, 1fr) 72px;
            }

            .add-faucet-row-one .url-field {
                grid-column: 1 / -1;
            }

            .add-faucet-row-two {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .faucet-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }

        .faucet-name {
            font-weight: bold;
            overflow-wrap: anywhere;
            display: flex;
            align-items: flex-start;
            gap: 9px;
            min-width: 0;
        }

        .faucet-id {
            color: #ff9d2e;
            font-weight: 800;
            min-width: 2.2em;
            flex-shrink: 0;
        }

        .faucet-label { overflow-wrap: anywhere; }

        .admin-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .status-btn, .edit-btn {
            width: auto;
            flex-shrink: 0;
            padding: 7px 10px;
            font-size: 13px;
        }

        .edit-btn {
            background: #3498db;
            color: #fff;
        }

        .edit-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0,0,0,.78);
        }

        .edit-overlay.hidden { display: none; }

        .edit-dialog {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #555;
            border-radius: 10px;
            background: #252525;
            box-shadow: 0 8px 30px rgba(0,0,0,.6);
        }

        .edit-dialog h2 {
            margin-top: 0;
            color: #ff9900;
        }

        .edit-dialog input {
            width: 100%;
            height: 40px;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #555;
            border-radius: 4px;
            background: #171717;
            color: #fff;
        }

        .edit-dialog .edit-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .edit-dialog .edit-buttons button { flex: 1; }

        #editSaveButton {
            background: #ff9900;
            color: #111;
        }

        #editCancelButton {
            background: #555;
            color: #fff;
        }

        #editMessage {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 13px;
        }

        .btn-active {
            background: #ff4444;
            color: #fff;
        }

        .btn-disabled {
            background: #44ff44;
            color: #1a1a1a;
        }

        .nav-link {
            display: inline-block;
            margin-top: 15px;
            color: #00ffcc;
            text-decoration: none;
        }

        .message {
            text-align: center;
            overflow-wrap: anywhere;
        }

        @media (max-width: 450px) {
            body { padding: 10px; }
            .container { padding: 12px; }
            .faucet-item { align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">

    <div id="loginBlock">
        <h1>Вход в админку</h1>

        <div class="form-group">
            <label for="tokenInput">Введите ваш GitHub Token:</label>
            <input
                type="password"
                id="tokenInput"
                placeholder="github_pat_..."
                autocomplete="current-password"
            >
        </div>

        <button id="loginButton" type="button" onclick="login()">
            Войти
        </button>
    </div>

    <div id="adminBlock" class="hidden">
        <h1>Управление кранами</h1>

        <div class="add-faucet-panel">
            <h2>➕ Добавить новый кран</h2>

            <div class="add-faucet-row add-faucet-row-one">
                <div class="field">
                    <label for="newFaucetName">Название крана</label>
                    <input type="text" id="newFaucetName"
                           placeholder="Например: Prairiehash" autocomplete="off">
                </div>

                <div class="field">
                    <label for="newFaucetId">ID</label>
                    <input type="number" id="newFaucetId"
                           min="1" step="1" placeholder="36">
                </div>

                <div class="field url-field">
                    <label for="newFaucetUrl">Ссылка на кран</label>
                    <input type="url" id="newFaucetUrl"
                           placeholder="https://..." autocomplete="url">
                </div>
            </div>

            <div class="add-faucet-row add-faucet-row-two">
                <div class="field">
                    <label for="newFaucetReward">Награда (крипта)</label>
                    <input type="text" id="newFaucetReward"
                           placeholder="0.0005967" inputmode="decimal">
                </div>

                <div class="field">
                    <label for="newFaucetCoin">Валюта</label>
                    <input type="text" id="newFaucetCoin"
                           placeholder="DOGE" maxlength="20" autocomplete="off">
                </div>

                <div class="field">
                    <label for="newFaucetTime">Таймер (минуты)</label>
                    <input type="number" id="newFaucetTime"
                           min="0" step="any" placeholder="5">
                </div>
            </div>

            <button id="addFaucetButton" type="button">
                ➕ Добавить кран в index.html на GitHub
            </button>

            <p id="addFaucetMessage" role="status" aria-live="polite"></p>
        </div>

        <h2>Глобальный статус</h2>

        <div class="form-group">
            <button
                id="saveButton"
                type="button"
                onclick="saveChanges()"
                style="background:#ffcc00;color:#000;margin-bottom:20px;"
            >
                💾 Сохранить изменения на сайт
            </button>
        </div>

        <div id="faucetsList"></div>
    </div>

    <div id="editOverlay" class="edit-overlay hidden"
         role="dialog" aria-modal="true" aria-labelledby="editTitle">

        <div class="edit-dialog">
            <h2 id="editTitle">✏️ Редактировать кран</h2>
            <p id="editIdLabel" style="color:#ff9d2e;font-weight:bold;"></p>

            <form id="editFaucetForm">
                <div class="form-group">
                    <label for="editFaucetName">Название крана</label>
                    <input type="text" id="editFaucetName" required maxlength="150">
                </div>

                <div class="form-group">
                    <label for="editFaucetUrl">Ссылка на кран</label>
                    <input type="url" id="editFaucetUrl" required>
                </div>

                <div class="form-group">
                    <label for="editFaucetReward">Награда (крипта)</label>
                    <input type="text" id="editFaucetReward"
                           required inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="editFaucetCoin">Валюта</label>
                    <input type="text" id="editFaucetCoin" required maxlength="20">
                </div>

                <div class="form-group">
                    <label for="editFaucetTime">Таймер (минуты)</label>
                    <input type="number" id="editFaucetTime"
                           required min="0" step="any">
                </div>

                <p id="editMessage" role="status" aria-live="polite"></p>

                <div class="edit-buttons">
                    <button id="editSaveButton" type="submit">
                        💾 Сохранить на GitHub
                    </button>
                    <button id="editCancelButton" type="button">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <a href="index.html" class="nav-link">← Вернуться на главную</a>
</div>

<script>
'use strict';

const GITHUB_USER = "cryptofaucet";
const GITHUB_REPO = "faucets";
const FILE_PATH = "status.json";
const INDEX_FILE_PATH = "index.html";
const BRANCH = "main";

const GITHUB_API_URL =
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

const INDEX_API_URL =
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${INDEX_FILE_PATH}`;

let FAUCETS = [];
let globalDisabledFaucets = [];
let faucetSettings = {};
let fileSha = "";
let editingFaucetId = null;
let editingOriginalValues = null;

function githubHeaders(token) {
    return {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
    };
}

function decodeBase64UTF8(value) {
    const binary = atob(value.replace(/\s/g, ""));
    const bytes = Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
    );
    return new TextDecoder("utf-8").decode(bytes);
}

function encodeBase64UTF8(value) {
    const bytes = new TextEncoder().encode(value);
    let binary = "";
    const chunkSize = 0x8000;

    for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
    }

    return btoa(binary);
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function escapeAttribute(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

window.addEventListener("load", function () {
    const savedToken = sessionStorage.getItem("git_admin_token");

    if (savedToken) {
        document.getElementById("tokenInput").value = savedToken;
        login();
    }
});

async function login() {
    const token = document.getElementById("tokenInput").value.trim();

    if (!token) {
        alert("Введите GitHub Token!");
        return;
    }

    const loginButton = document.getElementById("loginButton");
    loginButton.disabled = true;
    loginButton.textContent = "Подключение...";

    try {
        const response = await fetch(GITHUB_API_URL, {
            method: "GET",
            headers: githubHeaders(token),
            cache: "no-store"
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                `GitHub: ${response.status} — ` +
                (data.message || "Не удалось прочитать status.json")
            );
        }

        if (!data.content || !data.sha) {
            throw new Error("GitHub не вернул содержимое файла или SHA.");
        }

        const content = JSON.parse(decodeBase64UTF8(data.content));

        if (!content || typeof content !== "object" || Array.isArray(content)) {
            throw new Error("Некорректный формат status.json.");
        }

        globalDisabledFaucets = Array.isArray(content.disabled_faucets)
            ? [...new Set(content.disabled_faucets)]
            : [];

        faucetSettings =
            content.faucet_settings &&
            typeof content.faucet_settings === "object" &&
            !Array.isArray(content.faucet_settings)
                ? content.faucet_settings
                : {};

        fileSha = data.sha;
        sessionStorage.setItem("git_admin_token", token);

        document.getElementById("loginBlock").classList.add("hidden");
        document.getElementById("adminBlock").classList.remove("hidden");

        await fetchAndParseFaucets();

    } catch (error) {
        console.error("Ошибка входа:", error);
        alert(
            "Не удалось войти в админку.\n\n" +
            error.message +
            "\n\nПроверь адрес API, доступ к репозиторию и права токена."
        );

    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Войти";
    }
}

async function fetchAndParseFaucets() {
    const listDiv = document.getElementById("faucetsList");

    listDiv.innerHTML =
        '<p class="message" style="color:#ffcc00;">' +
        'Загружаю список кранов с GitHub...</p>';

    try {
        const token = sessionStorage.getItem("git_admin_token");

        if (!token) {
            throw new Error("Токен GitHub не найден. Войдите заново.");
        }

        const response = await fetch(
            `${INDEX_API_URL}?ref=${encodeURIComponent(BRANCH)}`,
            {
                method: "GET",
                headers: githubHeaders(token),
                cache: "no-store"
            }
        );

        const fileData = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                `GitHub ${response.status}: ` +
                (fileData.message || "Не удалось загрузить index.html")
            );
        }

        if (!fileData.content) {
            throw new Error("GitHub не вернул содержимое index.html.");
        }

        const html = decodeBase64UTF8(fileData.content);
        const doc = new DOMParser().parseFromString(html, "text/html");
        const rows = doc.querySelectorAll('tr[id^="faucet"]');

        FAUCETS = Array.from(rows)
            .map(row => {
                const match = row.id.match(/^faucet(\d+)$/);
                const link = row.querySelector("a.faucet-link");

                if (!match || !link) return null;

                const name = link.textContent.trim();
                if (!name) return null;

                return { id: match[1], name };
            })
            .filter(Boolean);

        FAUCETS = Array.from(
            new Map(FAUCETS.map(faucet => [faucet.name, faucet])).values()
        );

        if (FAUCETS.length === 0) {
            listDiv.innerHTML =
                '<p class="message" style="color:#ff6666;">' +
                'Краны не найдены. Проверь разметку index.html.</p>';
            return;
        }

        renderAdminList();

    } catch (error) {
        console.error("Ошибка загрузки списка:", error);

        listDiv.innerHTML =
            '<p class="message" style="color:#ff6666;">' +
            'Не удалось загрузить список кранов: ' +
            escapeHTML(error.message) +
            '</p>';
    }
}

function renderAdminList() {
    const listDiv = document.getElementById("faucetsList");
    listDiv.replaceChildren();

    FAUCETS.forEach(faucet => {
        const { id, name } = faucet;
        const isDisabled = globalDisabledFaucets.includes(name);

        const item = document.createElement("div");
        item.className = "faucet-item";

        const nameSpan = document.createElement("span");
        nameSpan.className = "faucet-name";

        const idSpan = document.createElement("span");
        idSpan.className = "faucet-id";
        idSpan.textContent = id;
        idSpan.setAttribute("aria-label", "ID крана " + id);

        const label = document.createElement("a");
        label.className = "faucet-label";
        label.href = "#";
        label.textContent = name;
        label.style.color = "#fff";
        label.style.textDecoration = "none";

        label.addEventListener("click", function (event) {
            event.preventDefault();
            openEditFaucet(id);
        });

        nameSpan.append(idSpan, label);

        const actions = document.createElement("div");
        actions.className = "admin-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit-btn";
        editButton.textContent = "✏️ Изменить";
        editButton.addEventListener("click", function () {
            openEditFaucet(id);
        });

        const button = document.createElement("button");
        button.type = "button";
        button.className =
            "status-btn " +
            (isDisabled ? "btn-disabled" : "btn-active");

        button.textContent = isDisabled
            ? "❌ Отключен (Включить)"
            : "✅ Работает (Отключить)";

        button.addEventListener("click", function () {
            toggleFaucet(name);
        });

        actions.append(editButton, button);
        item.append(nameSpan, actions);
        listDiv.appendChild(item);
    });
}

function toggleFaucet(name) {
    if (globalDisabledFaucets.includes(name)) {
        globalDisabledFaucets =
            globalDisabledFaucets.filter(item => item !== name);
    } else {
        globalDisabledFaucets.push(name);
    }

    renderAdminList();
}

// Сохраняем статус, не удаляя настройки кранов из JSON.
async function saveChanges() {
    const token = sessionStorage.getItem("git_admin_token");

    if (!token) {
        alert("Сессия истекла. Войдите заново.");
        return;
    }

    const saveButton = document.getElementById("saveButton");
    saveButton.disabled = true;
    saveButton.textContent = "Сохранение...";

    try {
        const checkResponse = await fetch(GITHUB_API_URL, {
            method: "GET",
            headers: githubHeaders(token),
            cache: "no-store"
        });

        const currentData = await checkResponse.json().catch(() => ({}));

        if (!checkResponse.ok || !currentData.sha || !currentData.content) {
            throw new Error(
                `Не удалось прочитать status.json: ${checkResponse.status} — ` +
                (currentData.message || "Ошибка GitHub")
            );
        }

        const existingContent = JSON.parse(
            decodeBase64UTF8(currentData.content)
        );

        if (
            !existingContent ||
            typeof existingContent !== "object" ||
            Array.isArray(existingContent)
        ) {
            throw new Error("Некорректный формат status.json.");
        }

        const newContent = {
            ...existingContent,
            disabled_faucets: globalDisabledFaucets,
            faucet_settings:
                existingContent.faucet_settings &&
                typeof existingContent.faucet_settings === "object" &&
                !Array.isArray(existingContent.faucet_settings)
                    ? existingContent.faucet_settings
                    : {},
            last_updated: new Date().toISOString()
        };

        const response = await fetch(GITHUB_API_URL, {
            method: "PUT",
            headers: {
                ...githubHeaders(token),
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: "Update global faucet statuses",
                content: encodeBase64UTF8(JSON.stringify(newContent, null, 2)),
                sha: currentData.sha,
                branch: BRANCH
            })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                `GitHub: ${response.status} — ` +
                (result.message || "Не удалось сохранить status.json")
            );
        }

        fileSha = result.content?.sha || currentData.sha;
        faucetSettings = newContent.faucet_settings;

        alert(
            "Статусы сохранены в status.json!\n" +
            "Настройки кранов сохранены отдельно и не удалены."
        );

    } catch (error) {
        console.error("Ошибка сохранения:", error);
        alert("Не удалось сохранить изменения.\n\n" + error.message);

    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "💾 Сохранить изменения на сайт";
    }
}

function showEditMessage(message, isError = false) {
    const el = document.getElementById("editMessage");
    el.textContent = message;
    el.style.color = isError ? "#ff7777" : "#2ecc71";
}

function closeEditFaucet() {
    document.getElementById("editOverlay").classList.add("hidden");
    editingFaucetId = null;
    editingOriginalValues = null;
}

document.getElementById("editCancelButton").addEventListener(
    "click",
    closeEditFaucet
);

document.getElementById("editOverlay").addEventListener("click", function (event) {
    if (event.target === this) closeEditFaucet();
});

document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") closeEditFaucet();
});

document.getElementById("editFaucetCoin").addEventListener("input", function () {
    this.value = this.value.toUpperCase();
});

// Сохраняем глобальные настройки выбранного крана в status.json.
async function saveFaucetSettingsToStatus(token, id, settings) {
    const response = await fetch(GITHUB_API_URL, {
        method: "GET",
        headers: githubHeaders(token),
        cache: "no-store"
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.content || !data.sha) {
        throw new Error(
            `Не удалось прочитать status.json: ${data.message || response.status}`
        );
    }

    const content = JSON.parse(decodeBase64UTF8(data.content));

    if (!content || typeof content !== "object" || Array.isArray(content)) {
        throw new Error("Некорректный формат status.json.");
    }

    content.disabled_faucets = Array.isArray(content.disabled_faucets)
        ? content.disabled_faucets
        : [];

    content.faucet_settings =
        content.faucet_settings &&
        typeof content.faucet_settings === "object" &&
        !Array.isArray(content.faucet_settings)
            ? content.faucet_settings
            : {};

    content.faucet_settings[String(id)] = {
        name: settings.name,
        url: settings.url,
        reward: settings.reward,
        coin: settings.coin,
        minutes: settings.minutes,
        _updated_at: new Date().toISOString()
    };

    content.last_updated = new Date().toISOString();

    const putResponse = await fetch(GITHUB_API_URL, {
        method: "PUT",
        headers: {
            ...githubHeaders(token),
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: `Update global settings for faucet ${id}`,
            content: encodeBase64UTF8(JSON.stringify(content, null, 2)),
            sha: data.sha,
            branch: BRANCH
        })
    });

    const result = await putResponse.json().catch(() => ({}));

    if (!putResponse.ok) {
        throw new Error(
            `index.html обновлён, но настройки в status.json сохранить не удалось: ` +
            `${result.message || putResponse.status}. Проверь оба файла.`
        );
    }

    faucetSettings[String(id)] = content.faucet_settings[String(id)];
    fileSha = result.content?.sha || data.sha;
}

async function openEditFaucet(id) {
    const token = sessionStorage.getItem("git_admin_token");

    if (!token) {
        alert("Сессия админки истекла. Войди заново.");
        return;
    }

    editingFaucetId = String(id);
    editingOriginalValues = null;

    document.getElementById("editOverlay").classList.remove("hidden");
    document.getElementById("editIdLabel").textContent =
        "ID: " + id + " (ID не изменяется)";
    document.getElementById("editFaucetForm").reset();
    document.getElementById("editSaveButton").disabled = true;
    showEditMessage("Загружаю данные крана с GitHub...");

    try {
        const response = await fetch(
            `${INDEX_API_URL}?ref=${encodeURIComponent(BRANCH)}`,
            {
                method: "GET",
                headers: githubHeaders(token),
                cache: "no-store"
            }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.content) {
            throw new Error(
                `GitHub ${response.status}: ` +
                (data.message || "Не удалось прочитать index.html")
            );
        }

        const doc = new DOMParser().parseFromString(
            decodeBase64UTF8(data.content),
            "text/html"
        );

        const row = doc.getElementById("faucet" + id);

        if (!row) {
            throw new Error("Строка faucet" + id + " не найдена в index.html.");
        }

        const link = row.querySelector("a.faucet-link");
        const rewardInput = row.querySelector("input.crypto-input");
        const badge = row.querySelector(".crypto-badge");

        if (!link || !rewardInput || !badge) {
            throw new Error(
                "В строке крана не найдены все необходимые поля."
            );
        }

        const timerMatch = (
            link.getAttribute("onclick") || ""
        ).match(
            /startTimer\s*\(\s*['"]faucet\d+['"]\s*,\s*(\d+(?:\.\d+)?)\s*\)/
        );

        const seconds = timerMatch ? Number(timerMatch[1]) : 0;

        editingOriginalValues = {
            name: link.textContent.trim(),
            url: link.getAttribute("href") || link.href,
            reward: rewardInput.getAttribute("value") ??
                rewardInput.value ?? "",
            coin: badge.textContent.trim().toUpperCase(),
            minutes: seconds / 60
        };

        document.getElementById("editFaucetName").value =
            editingOriginalValues.name;
        document.getElementById("editFaucetUrl").value =
            editingOriginalValues.url;
        document.getElementById("editFaucetReward").value =
            editingOriginalValues.reward;
        document.getElementById("editFaucetCoin").value =
            editingOriginalValues.coin;
        document.getElementById("editFaucetTime").value =
            String(editingOriginalValues.minutes);

        showEditMessage(
            "Данные загружены. После сохранения обновятся index.html и status.json."
        );

    } catch (error) {
        console.error("Ошибка загрузки крана:", error);
        showEditMessage(error.message || "Не удалось загрузить данные.", true);

    } finally {
        document.getElementById("editSaveButton").disabled = false;
    }
}

async function saveEditedFaucet(event) {
    event.preventDefault();

    const id = editingFaucetId;
    const token = sessionStorage.getItem("git_admin_token");

    if (!id || !token) {
        showEditMessage(
            "Нет выбранного крана или истекла сессия. Закрой окно и войди заново.",
            true
        );
        return;
    }

    const name = document.getElementById("editFaucetName").value.trim();
    const urlText = document.getElementById("editFaucetUrl").value.trim();
    const reward = document.getElementById("editFaucetReward").value.trim();
    const coin = document.getElementById("editFaucetCoin").value.trim().toUpperCase();
    const minutes = Number(document.getElementById("editFaucetTime").value);

    if (!name || !urlText || !reward || !coin ||
        !Number.isFinite(minutes) || minutes < 0) {
        showEditMessage(
            "Заполни все поля корректно. Таймер должен быть неотрицательным.",
            true
        );
        return;
    }

    if (!/^[A-Z0-9._-]+$/.test(coin)) {
        showEditMessage(
            "В валюте используй латинские буквы, цифры, точку, дефис или подчёркивание.",
            true
        );
        return;
    }

    let parsedURL;

    try {
        parsedURL = new URL(urlText);
    } catch (_) {
        showEditMessage("Укажи корректную ссылку.", true);
        return;
    }

    if (parsedURL.protocol !== "https:" && parsedURL.protocol !== "http:") {
        showEditMessage(
            "Ссылка должна начинаться с http:// или https://.",
            true
        );
        return;
    }

    const saveButton = document.getElementById("editSaveButton");
    saveButton.disabled = true;
    saveButton.textContent = "Сохраняю на GitHub...";
    showEditMessage("");

    try {
        const headers = githubHeaders(token);

        const getResponse = await fetch(
            `${INDEX_API_URL}?ref=${encodeURIComponent(BRANCH)}`,
            {
                method: "GET",
                headers,
                cache: "no-store"
            }
        );

        const fileData = await getResponse.json().catch(() => ({}));

        if (!getResponse.ok || !fileData.content || !fileData.sha) {
            throw new Error(
                `GitHub ${getResponse.status}: ` +
                (fileData.message || "Не удалось загрузить index.html")
            );
        }

        let source = decodeBase64UTF8(fileData.content);
        const doc = new DOMParser().parseFromString(source, "text/html");
        const row = doc.getElementById("faucet" + id);

        if (!row) {
            throw new Error(
                "Строка faucet" + id + " не найдена. Ничего не сохранено."
            );
        }

        const link = row.querySelector("a.faucet-link");
        const rewardInput = row.querySelector("input.crypto-input");
        const badge = row.querySelector(".crypto-badge");

        if (!link || !rewardInput || !badge) {
            throw new Error(
                "В выбранной строке не хватает нужных полей. Ничего не сохранено."
            );
        }

        const duplicate = Array.from(
            doc.querySelectorAll('tr[id^="faucet"] a.faucet-link')
        ).some(other =>
            other.closest("tr")?.id !== "faucet" + id &&
            other.textContent.trim().toLowerCase() === name.toLowerCase()
        );

        if (duplicate) {
            throw new Error(`Название «${name}» уже используется другим краном.`);
        }

        link.textContent = name;
        link.setAttribute("href", parsedURL.href);
        link.setAttribute(
            "onclick",
            `startTimer('faucet${id}', ${Math.round(minutes * 60)})`
        );

        rewardInput.setAttribute("value", reward);
        rewardInput.value = reward;

        badge.textContent = coin;
        badge.className = "badge " + coin.toLowerCase() + " crypto-badge";
        row.setAttribute("data-crypto", coin);

        const rowPattern = new RegExp(
            `<tr\\b(?=[^>]*\\bid=["']faucet${id}["'])[^>]*>[\\s\\S]*?<\\/tr>`,
            "i"
        );

        if (!rowPattern.test(source)) {
            throw new Error(
                "Не удалось безопасно выделить строку крана. Ничего не сохранено."
            );
        }

        source = source.replace(rowPattern, row.outerHTML);

        const safeCommentName = name
            .replace(/--/g, "—")
            .replace(/[<>]/g, "");

        const commentPattern = new RegExp(
            `<!--\\s*Faucet\\s+${id}\\s*:[\\s\\S]*?-->\\s*(?=<tr\\b(?=[^>]*\\bid=["']faucet${id}["']))`,
            "i"
        );

        source = source.replace(
            commentPattern,
            `<!-- Faucet ${id}: ${safeCommentName} -->\n`
        );

        const putResponse = await fetch(INDEX_API_URL, {
            method: "PUT",
            headers: {
                ...headers,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: `Edit faucet ${id}: ${name}`,
                content: encodeBase64UTF8(source),
                sha: fileData.sha,
                branch: BRANCH
            })
        });

        const putData = await putResponse.json().catch(() => ({}));

        if (!putResponse.ok) {
            throw new Error(
                `GitHub ${putResponse.status}: ` +
                (putData.message || "Не удалось сохранить index.html")
            );
        }

        const oldFaucet = FAUCETS.find(faucet => faucet.id === String(id));
        const oldName = oldFaucet?.name;

        if (oldFaucet) {
            oldFaucet.name = name;
        }

        if (oldName && oldName !== name &&
            globalDisabledFaucets.includes(oldName)) {
            globalDisabledFaucets = globalDisabledFaucets.map(
                item => item === oldName ? name : item
            );
        }

        await saveFaucetSettingsToStatus(token, id, {
            name,
            url: parsedURL.href,
            reward,
            coin,
            minutes
        });

        renderAdminList();

        showEditMessage(
            `Готово! Кран ID ${id} обновлён в index.html и status.json на GitHub.`
        );

        saveButton.textContent = "Сохранено ✓";
        setTimeout(closeEditFaucet, 1200);

    } catch (error) {
        console.error("Ошибка сохранения крана:", error);
        showEditMessage(error.message || "Не удалось сохранить изменения.", true);

    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "💾 Сохранить на GitHub";
    }
}

document.getElementById("editFaucetForm").addEventListener(
    "submit",
    saveEditedFaucet
);

function setAddFaucetMessage(message, isError = false) {
    const messageElement = document.getElementById("addFaucetMessage");
    messageElement.textContent = message;
    messageElement.style.color = isError ? "#ff7777" : "#2ecc71";
}

function makeNewFaucetRow(name, num, url, reward, coin, seconds) {
    const id = "faucet" + num;
    const safeName = escapeHTML(name);
    const safeURL = escapeHTML(url);
    const safeReward = escapeHTML(reward);
    const safeCoin = escapeHTML(coin);
    const coinLower = coin.toLowerCase();
    const commentName = name.replace(/--/g, "—").replace(/[<>]/g, "");

    return `<!-- Faucet ${num}: ${commentName} -->
<tr id="${id}" data-crypto="${safeCoin}">
    <!-- 1. Название --><td><a class="faucet-link" href="${safeURL}" target="_blank" rel="noopener" onclick="startTimer('${id}', ${seconds})">${safeName}</a></td>
    <!-- 2. Ввод баланса --><td style="padding: 0 4px; vertical-align: middle; width: 1%; white-space: nowrap;"><input type="text" inputmode="decimal" class="crypto-input" placeholder="0.00" value="${safeReward}" style="width: 55px; height: 20px; padding: 2px; border: 1px dashed #ccc; border-radius: 3px; font-size: 11px; text-align: center; transition: width 0.2s;" onfocus="this.style.width='110px'; this.style.border='1px solid #3498db';" onblur="this.style.width='55px'; this.style.border='1px dashed #ccc';"></td>
    <!-- 3. Валюта --><td style="padding: 0 4px; vertical-align: middle; width: 1%; white-space: nowrap;"><span class="badge ${coinLower} crypto-badge" onclick="window.editBadge('${id}', this)">${safeCoin}</span></td>
    <!-- 4. Рубли --><td style="padding: 0 8px; vertical-align: middle; min-width: 85px; white-space: nowrap;"><span class="rub-result" id="rub_res_${id}" style="font-size: 13px; font-weight: bold; color: #2ecc71;">0.00 ₽</span></td>
    <!-- 5. Таймер --><td><div class="timer-wrapper"><span class="timer-cell ready">Готов</span><button class="btn-reset" onclick="resetTimer('${id}')">✕</button><button class="btn-limit" onclick="toggleLimit('${id}')">⚠️</button></div></td>
</tr>`;
}

async function addFaucetToIndex() {
    const token = sessionStorage.getItem("git_admin_token");

    if (!token) {
        setAddFaucetMessage("Сессия админки истекла. Войди заново.", true);
        return;
    }

    const name = document.getElementById("newFaucetName").value.trim();
    const numText = document.getElementById("newFaucetId").value.trim();
    const urlText = document.getElementById("newFaucetUrl").value.trim();
    const reward = document.getElementById("newFaucetReward").value.trim();
    const coin = document.getElementById("newFaucetCoin").value.trim().toUpperCase();
    const timeText = document.getElementById("newFaucetTime").value.trim();

    if (!name || !numText || !urlText || !reward || !coin || !timeText) {
        setAddFaucetMessage("Заполни все шесть полей.", true);
        return;
    }

    const num = Number(numText);
    const minutes = Number(timeText);

    if (!Number.isSafeInteger(num) || num < 1) {
        setAddFaucetMessage("ID должен быть целым положительным числом.", true);
        return;
    }

    if (!Number.isFinite(minutes) || minutes < 0) {
        setAddFaucetMessage("Укажи корректное время таймера.", true);
        return;
    }

    if (!/^[A-Z0-9._-]+$/.test(coin)) {
        setAddFaucetMessage(
            "В валюте используй латинские буквы, цифры, точку, дефис или подчёркивание.",
            true
        );
        return;
    }

    let parsedURL;

    try {
        parsedURL = new URL(urlText);
    } catch (_) {
        setAddFaucetMessage("Укажи корректную ссылку на кран.", true);
        return;
    }

    if (parsedURL.protocol !== "https:" && parsedURL.protocol !== "http:") {
        setAddFaucetMessage(
            "Ссылка должна начинаться с http:// или https://.",
            true
        );
        return;
    }

    const button = document.getElementById("addFaucetButton");
    button.disabled = true;
    button.textContent = "Проверяю index.html...";
    setAddFaucetMessage("");

    try {
        const headers = githubHeaders(token);

        const getResponse = await fetch(
            `${INDEX_API_URL}?ref=${encodeURIComponent(BRANCH)}`,
            {
                method: "GET",
                headers,
                cache: "no-store"
            }
        );

        const fileData = await getResponse.json().catch(() => ({}));

        if (!getResponse.ok) {
            throw new Error(
                `GitHub ${getResponse.status}: ` +
                (fileData.message || "Не удалось прочитать index.html")
            );
        }

        if (!fileData.content || !fileData.sha) {
            throw new Error("GitHub не вернул содержимое index.html или SHA.");
        }

        let source = decodeBase64UTF8(fileData.content);
        const id = "faucet" + num;
        const idPattern = new RegExp(`\\bid=["']${id}["']`, "i");

        if (idPattern.test(source)) {
            throw new Error(`ID ${id} уже занят. Выбери другой номер.`);
        }

        const parsedDoc = new DOMParser().parseFromString(source, "text/html");

        const duplicateName = Array.from(
            parsedDoc.querySelectorAll('tr[id^="faucet"] a.faucet-link')
        ).some(link =>
            link.textContent.trim().toLowerCase() === name.toLowerCase()
        );

        if (duplicateName) {
            throw new Error(`Кран «${name}» уже есть в index.html.`);
        }

        const tbodyPattern =
            /(<tbody\b[^>]*class=["'][^"']*\bleft-faucets\b[^"']*["'][^>]*>)([\s\S]*?)(<\/tbody>)/i;

        const tbodyMatch = source.match(tbodyPattern);

        if (!tbodyMatch) {
            throw new Error(
                "Не найден основной список tbody.left-faucets. Файл не изменён."
            );
        }

        const seconds = Math.round(minutes * 60);
        const rowHTML = makeNewFaucetRow(
            name, num, parsedURL.href, reward, coin, seconds
        );

        const updatedTbody =
            tbodyMatch[1] +
            tbodyMatch[2].replace(/\s*$/, "\n") +
            rowHTML + "\n" +
            tbodyMatch[3];

        source = source.replace(tbodyPattern, () => updatedTbody);

        button.textContent = "Сохраняю на GitHub...";

        const putResponse = await fetch(INDEX_API_URL, {
            method: "PUT",
            headers: {
                ...headers,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: `Add faucet ${num}: ${name}`,
                content: encodeBase64UTF8(source),
                sha: fileData.sha,
                branch: BRANCH
            })
        });

        const putData = await putResponse.json().catch(() => ({}));

        if (!putResponse.ok) {
            throw new Error(
                `GitHub ${putResponse.status}: ` +
                (putData.message || "Не удалось сохранить index.html")
            );
        }

        if (!FAUCETS.some(faucet => faucet.id === String(num))) {
            FAUCETS.push({ id: String(num), name });
            renderAdminList();
        }

        setAddFaucetMessage(
            `Готово! «${name}» (ID ${num}) добавлен в index.html на GitHub.\n` +
            "Глобальные настройки для него появятся после первого редактирования."
        );

        document.getElementById("newFaucetName").value = "";
        document.getElementById("newFaucetUrl").value = "";
        document.getElementById("newFaucetReward").value = "";
        document.getElementById("newFaucetCoin").value = "";
        document.getElementById("newFaucetTime").value = "";
        document.getElementById("newFaucetId").value = String(num + 1);

    } catch (error) {
        console.error("Ошибка добавления крана:", error);
        setAddFaucetMessage(error.message || "Неизвестная ошибка.", true);

    } finally {
        button.disabled = false;
        button.textContent = "➕ Добавить кран в index.html на GitHub";
    }
}

document.getElementById("newFaucetCoin").addEventListener("input", function () {
    this.value = this.value.toUpperCase();
});

document.getElementById("addFaucetButton").addEventListener(
    "click",
    addFaucetToIndex
);
</script>
